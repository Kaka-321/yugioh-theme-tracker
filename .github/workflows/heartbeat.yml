name: Weekly Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "41 19 * * 0"

permissions:
  contents: write

concurrency:
  group: theme-data-update
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write heartbeat
        run: |
          mkdir -p data/meta
          printf '{"schema_version":"1.0.0","heartbeat_at":"%s","run_id":"%s"}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$GITHUB_RUN_ID" \
            > data/meta/heartbeat.json

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta/heartbeat.json
          if git diff --cached --quiet; then
            echo "No heartbeat changes"
          else
            git commit -m "chore: weekly heartbeat"
            git push
          fi
