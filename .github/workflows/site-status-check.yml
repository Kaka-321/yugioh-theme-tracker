name: Site and Data Freshness Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions: {}

concurrency:
  group: site-status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site and status freshness
        env:
          SITE_URL: "https://Kaka-321.github.io/yugioh-theme-tracker/"
          STATUS_URL: "https://Kaka-321.github.io/yugioh-theme-tracker/status.json"
          MAX_AGE_HOURS: "48"
        run: |
          set -euo pipefail

          echo "Checking site: $SITE_URL"
          site_http_code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL")"

          if [ "$site_http_code" != "200" ]; then
            echo "Site check failed: HTTP $site_http_code"
            exit 1
          fi

          echo "Checking status: $STATUS_URL"
          status_json="$(curl -fsS --max-time 20 "$STATUS_URL")"

          echo "$status_json" | jq -e . > /dev/null

          last_success_at="$(echo "$status_json" | jq -r '.last_success_at // empty')"

          if [ -z "$last_success_at" ]; then
            echo "status.json does not contain last_success_at"
            exit 1
          fi

          last_success_epoch="$(date -u -d "$last_success_at" +%s)"
          now_epoch="$(date -u +%s)"
          age_hours="$(( (now_epoch - last_success_epoch) / 3600 ))"

          echo "Data age: ${age_hours} hours"

          if [ "$age_hours" -gt "$MAX_AGE_HOURS" ]; then
            echo "Data is stale: older than $MAX_AGE_HOURS hours"
            exit 1
          fi

      - name: Ping Healthchecks.io success
        if: ${{ success() }}
        run: curl -fsS --retry 5 --max-time 10 "${{ secrets.HC_PING_SITE_STATUS_URL }}"

  ping-failure:
    runs-on: ubuntu-latest
    needs: [check]
    if: ${{ failure() }}
    steps:
      - name: Ping Healthchecks.io failure
        run: curl -fsS --retry 5 --max-time 10 "${{ secrets.HC_PING_SITE_STATUS_URL }}/fail"