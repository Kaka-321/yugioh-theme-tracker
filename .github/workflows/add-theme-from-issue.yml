name: Add Theme from Issue

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: add-theme-from-issue
  cancel-in-progress: false

jobs:
  add-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[theme-request]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add theme
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python crawler/add_theme_from_issue.py

      - name: Commit theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crawler/themes.py
          if git diff --cached --quiet; then
            echo "No theme changes"
          else
            git commit -m "feat: register theme from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Update theme data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run update.yml --ref main