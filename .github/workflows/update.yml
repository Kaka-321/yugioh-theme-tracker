name: Update Theme Data

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: theme-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore API cache
        id: api-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/yugipedia-blue-eyes.json
          key: yugipedia-blue-eyes-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            yugipedia-blue-eyes-v1-

      - name: Generate theme data
        id: generate
        run: |
          cache=".cache/yugipedia-blue-eyes.json"

          before="missing"
          if [ -f "$cache" ]; then
            before=$(sha256sum "$cache" | cut -d ' ' -f 1)
          fi

          python crawler/main.py

          after=$(sha256sum "$cache" | cut -d ' ' -f 1)

          if [ "$before" != "$after" ]; then
            echo "cache_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save refreshed API cache
        if: steps.generate.outputs.cache_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/yugipedia-blue-eyes.json
          key: ${{ steps.api-cache.outputs.cache-primary-key }}

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/themes/blue-eyes.json
          if git diff --cached --quiet; then
            echo "No content changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): update theme data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
