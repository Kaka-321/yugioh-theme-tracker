name: Update Theme Data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: theme-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore API cache
        id: api-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/*.json
          key: yugipedia-themes-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            yugipedia-themes-v1-

      - name: Generate theme data
        id: generate
        run: |
          before=""
          if compgen -G ".cache/*.json" > /dev/null; then
            before=$(find .cache -maxdepth 1 -type f -name '*.json' -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d ' ' -f 1)
          fi

          python crawler/main.py

          after=""
          if compgen -G ".cache/*.json" > /dev/null; then
            after=$(find .cache -maxdepth 1 -type f -name '*.json' -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d ' ' -f 1)
          fi

          if [ "$before" != "$after" ]; then
            echo "cache_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save refreshed API cache
        if: steps.generate.outputs.cache_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/*.json
          key: ${{ steps.api-cache.outputs.cache-primary-key }}

      - name: Write public status
        run: |
          mkdir -p site
          UTC_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"schema_version":1,"last_success_at":"%s","freshness_hours":0,"health":"ok","stale":false}\n' \
            "$UTC_TIME" \
            > site/status.json

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/themes site/status.json site/themes.json
          if git diff --cached --quiet; then
            echo "No content changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): update theme data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-report
          path: data/internal/status.json
          retention-days: 14
          if-no-files-found: warn

  ping-success:
    runs-on: ubuntu-latest
    needs: [update]
    if: ${{ success() }}
    steps:
      - name: Ping Healthchecks.io success
        run: curl -fsS --retry 5 --max-time 10 "${{ secrets.HC_PING_CRAWL_URL }}"

  ping-failure:
    runs-on: ubuntu-latest
    needs: [update]
    if: ${{ failure() }}
    steps:
      - name: Ping Healthchecks.io failure
        run: curl -fsS --retry 5 --max-time 10 "${{ secrets.HC_PING_CRAWL_URL }}/fail"
