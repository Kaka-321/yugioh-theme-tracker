name: Add Theme Batch

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of themes to add"
        required: false
        default: "25"

permissions:
  contents: write
  actions: write

concurrency:
  group: add-theme-batch
  cancel-in-progress: false

jobs:
  add-themes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add next theme batch
        run: |
          python crawler/add_theme_batch.py --limit "${{ github.event.inputs.batch_size || 25 }}"

      - name: Generate theme data
        run: |
          python crawler/main.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crawler/themes.py data/themes site/themes.json
          if git diff --cached --quiet; then
            echo "No new themes to add"
          else
            git commit -m "feat: add next batch of archetype themes"
            git push
          fi

      - name: Request Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main