name: Discover Theme Candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "37 21 * * 1"

permissions:
  contents: write

concurrency:
  group: theme-candidate-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover theme candidates
        run: python crawler/discover_themes.py

      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/internal/theme_candidates.json
          if git diff --cached --quiet; then
            echo "No candidate changes"
          else
            git commit -m "chore(data): update theme candidates"
            git push
          fi