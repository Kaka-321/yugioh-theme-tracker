name: Deploy Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "data/themes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public files
        run: |
          mkdir -p build/data/themes
          cp site/index.html build/index.html
          cp data/themes/blue-eyes.json build/data/themes/blue-eyes.json

          if [ -f site/status.json ]; then
            cp site/status.json build/status.json
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
