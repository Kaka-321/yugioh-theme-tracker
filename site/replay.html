<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>展開リプレイ</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #333; }
    a { color: #24a; }
    .replay-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .replay-header h1 { font-size: 16px; margin: 0; }
    .btn { display: inline-block; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; background: #2b7; color: #fff; text-decoration: none; }
    .btn.secondary { background: #777; color: #fff; }
    .btn.small { padding: 4px 10px; font-size: 12px; }
    .btn:disabled { opacity: .45; cursor: default; }

    /* ===== モードタブ ===== */
    .mode-tabs { display: inline-flex; background: #f0f0f0; border-radius: 10px; padding: 3px; gap: 3px; }
    .mode-tab { border: none; background: transparent; border-radius: 8px; padding: 7px 16px; font-size: 13px; cursor: pointer; color: #555; }
    .mode-tab.active { background: #fff; color: #222; box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: bold; }

    /* ===== トランスポートバー ===== */
    .toolbar { display: flex; align-items: center; gap: 10px; background: #fafafa; border: 1px solid #e2e2e2; border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .tbtn { width: 34px; height: 34px; border-radius: 8px; border: none; background: #eee; cursor: pointer; font-size: 14px; }
    .tbtn.playing { background: #2b7; color: #fff; }
    .tbtn:disabled { opacity: .4; cursor: default; }
    .speed-group { display: flex; gap: 4px; margin-left: auto; }
    .speed-btn { border: none; background: #eee; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
    .speed-btn.active { background: #5b9; color: #fff; }
    .step-counter { font-size: 12px; color: #666; min-width: 56px; text-align: center; }
    input[type=range].seek { flex: 1 1 180px; accent-color: #2b7; }

    /* ===== 盤面（duel-simulator風のバランス配置） ===== */
    .board-wrap { background: #fbfbfb; border: 1px solid #e2e2e2; border-radius: 12px; padding: 14px; }
    .board-inner { max-width: 1060px; margin: 0 auto; }
    .opp-hand-strip { background: #f2f2f2; border: 1px dashed #c8c8c8; border-radius: 8px; padding: 8px; margin-bottom: 10px; min-height: 40px; }
    .opp-hand-strip .strip-title { font-size: 11px; color: #889; }

    .board-grid { display: flex; justify-content: center; align-items: stretch; gap: 12px; }
    .bcol { display: flex; flex-direction: column; gap: 8px; }
    .bcol.left { width: 64px; flex: 0 0 64px; justify-content: center; }
    .bcol.right { width: 92px; flex: 0 0 92px; }
    .bcol.center { flex: 0 1 auto; }

    .zone-row { display: grid; grid-template-columns: repeat(5, 84px); gap: 8px; justify-content: center; margin-bottom: 4px; }
    .zone-row.opp { grid-template-columns: repeat(5, 58px); gap: 6px; margin-bottom: 2px; }
    .slot { aspect-ratio: 59 / 86; border: 2px dashed; border-radius: 6px; overflow: hidden; width: 100%; }
    .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slot.monster { border-color: #c0b7e8; background: rgba(238, 236, 250, .8); }
    .slot.spell { border-color: #a8d8b2; background: rgba(233, 248, 236, .8); }
    .slot.oppmonster { border-color: #cfd0e2; background: rgba(240, 240, 248, .6); border-width: 1.5px; }
    .slot.acting { border-style: solid; outline: 3px solid #17c; outline-offset: -3px; box-shadow: 0 0 10px rgba(23, 119, 204, .6); }
    .zone-label { font-size: 10px; color: #788; margin: 2px 0 10px 2px; text-align: center; }

    .tallbox { border: 2px dashed; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; min-height: 0; }
    .tallbox.gy { border-color: #e9b0b0; background: rgba(252, 238, 238, .8); flex: 1 1 0; }
    .tallbox.banish { border-color: #c8c8c8; background: rgba(240, 240, 240, .8); }
    .tallbox.deckchip { border-color: #d8c48e; background: rgba(250, 246, 228, .9); align-self: center; }
    .tallbox.extrabox { border-color: #a8b4dc; background: rgba(236, 239, 251, .8); }
    .tallbox-name { font-size: 11px; font-weight: bold; color: #556; margin-bottom: 6px; }
    .stack { display: flex; flex-direction: column; gap: 3px; align-items: center; overflow-y: auto; max-height: 250px; }
    .stack img { width: 62%; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .stack .empty, .empty-strip { font-size: 11px; color: #aab; padding: 8px 6px; }

    .handrow, .dropzone { min-height: 40px; }
    .handrow { display: flex; flex-wrap: wrap; gap: 6px; }
    .hand-slot { width: 52px; aspect-ratio: 59 / 86; border-radius: 5px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .hand-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slot.acting, .hand-slot.acting { outline: 3px solid #17c; outline-offset: -3px; }
    .selected { outline: 3px solid #ff8800 !important; outline-offset: -3px; }
    .drag-ghost { position: fixed; z-index: 9999; width: 60px; pointer-events: none; opacity: .92; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
    .drag-ghost img { width: 100%; display: block; }
    .dragging-src { opacity: .4; }
    [data-drag] { touch-action: none; cursor: grab; }
    .drop-target { cursor: copy; }
    .drop-hint { outline: 3px dashed #17c !important; outline-offset: -3px; }

    /* ===== 手札/EX、デッキ、サイド ===== */
    .strip-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .strip-box { border: 1px solid #e2e2e2; background: #fff; border-radius: 10px; padding: 10px; }
    .strip-box.hand { flex: 0 0 280px; }
    .strip-box.extra { flex: 1 1 320px; }
    .strip-title { font-size: 12px; color: #556; margin-bottom: 8px; }
    .card-strip { display: flex; flex-wrap: wrap; gap: 4px; max-height: 150px; overflow-y: auto; }
    .card-strip img { width: 52px; border-radius: 3px; }
    .deck-panel { margin-top: 10px; border: 1px solid #e2e2e2; background: #fff; border-radius: 10px; padding: 10px; }
    .deck-strip { display: flex; flex-wrap: wrap; gap: 4px; }
    .deck-strip img { width: 66px; border-radius: 3px; }
    .deck-item { border-radius: 4px; }
    .manual-help { background: #eef7ff; border: 1px solid #b9d4f2; border-radius: 8px; padding: 10px; font-size: 12px; color: #345; margin-top: 10px; }

    /* ===== 外枠レイアウト ===== */
    .centered { max-width: 1060px; margin-left: auto; margin-right: auto; }
    .replay-layout { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    .replay-main { flex: 1 1 760px; min-width: 0; }
    .replay-side { flex: 0 0 320px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow-y: auto; }
    #step-panel { min-height: 300px; }
    .rec-match { font-size: 12px; color: #446; margin: 6px 0; }
    .rec-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
    .rec-bar > div { height: 100%; background: #2b7; }
    .rec-card { display: flex; gap: 8px; border: 1px solid #cde; background: #f4faff; border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; align-items: flex-start; }
    .rec-card img { width: 44px; border-radius: 3px; }
    .rec-card .rec-name { font-size: 13px; font-weight: bold; color: #234; }
    .rec-card .rec-act { font-size: 12px; color: #456; }
    .rec-card .rec-note { font-size: 11px; color: #667; margin-top: 2px; }
    .ai-row { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
    .ai-row input[type=password], .ai-row input[type=text] { flex: 1 1 120px; border: 1px solid #ccc; border-radius: 6px; padding: 5px 8px; font-size: 12px; }
    .ai-result { white-space: pre-wrap; font-size: 12px; color: #345; background: #f8f4ff; border: 1px solid #ddd0f0; border-radius: 8px; padding: 8px; margin-top: 8px; }
    .ai-note { font-size: 10px; color: #889; margin-top: 6px; }
    .ai-err { font-size: 12px; color: #c22; margin-top: 6px; }
    .panel { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
    .note { font-size: 12px; color: #667; margin-top: 8px; }
    .act-chip { display: inline-block; background: #eef; border: 1px solid #ccd; border-radius: 4px; font-size: 11px; color: #446; padding: 2px 8px; margin: 6px 0; }
    .step-image { width: 130px; height: auto; border-radius: 6px; }
    .step-note { font-size: 13px; margin-top: 6px; }
    .progress { font-size: 12px; color: #556; }
    .nav { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .crumb { font-size: 11px; background: #fff8e1; border: 1px solid #eec444; padding: 3px 8px; border-radius: 6px; margin-right: 6px; display: inline-block; }
    .history { margin-top: 10px; border-top: 1px dashed #ddd; padding-top: 6px; max-height: 150px; overflow-y: auto; }
    .history-line { font-size: 12px; color: #444; }
    .history-line.blocked { text-decoration: line-through; color: #aaa; }
    .disruption { display: flex; gap: 8px; align-items: center; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 5px 8px; margin-bottom: 6px; width: 100%; cursor: pointer; text-align: left; }
    .disruption img { width: 40px; height: auto; border-radius: 3px; }
    .disruption.glow { border-color: #e33; animation: dl-pulse 1s ease-in-out infinite alternate; }
    .disruption.disabled { opacity: .45; cursor: default; }
    @keyframes dl-pulse {
      from { box-shadow: 0 0 0 2px rgba(238,51,51,.25); }
      to   { box-shadow: 0 0 0 6px rgba(238,51,51,.5); }
    }
    .handlers { margin: 4px 0 10px; }
    .handler { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid #bbb; border-radius: 6px; padding: 6px 8px; margin: 4px 0; cursor: pointer; font-size: 12px; }
    .handler-note { font-size: 11px; color: #777; display: block; }
  </style>
</head>
<body>
  <header class="replay-header">
    <a class="btn secondary small" href="index.html">← 一覧へ戻る</a>
    <div class="mode-tabs" id="mode-tabs"></div>
    <h1 id="replay-title">展開リプレイ</h1>
    <div id="replay-crumb"></div>
  </header>

  <main class="replay-layout">
    <section class="replay-main centered">
      <div id="toolbar"></div>

      <div class="board-wrap">
        <div id="board" class="board-inner"></div>
        <div id="board-note" class="note"></div>
      </div>

      <div class="strip-row" id="hand-ex"></div>

      <div class="manual-help" id="manual-help" style="display:none"></div>

      <div class="deck-panel" id="deck-panel"></div>
      <div class="deck-panel" id="side-panel"></div>
    </section>

    <aside class="replay-side" id="replay-side">
      <div id="step-panel" class="panel"></div>
      <div id="assist-panel" class="panel"></div>
      <div id="disruption-panel" class="panel"></div>
    </aside>
  </main>

  <script>
    // ===== 状態 =====
    let deckData = null;
    let mode = "replay"; // "replay" | "manual"
    let state = null;          // リプレイ状態
    let manual = null;         // 手動操作状態: {monsters, spells, hand, gy, banish, pending:{entry,from}}
    let paramsTheme = "blue-eyes";
    let playing = false;
    let playTimer = null;
    let speed = "1x";
    const SPEED_MS = { "0.5x": 3000, "1x": 1500, "2x": 800, "3x": 400 };

    const toolbarDiv = document.getElementById("toolbar");
    const boardDiv = document.getElementById("board");
    const deckPanelDiv = document.getElementById("deck-panel");
    const sidePanelDiv = document.getElementById("side-panel");
    const handExDiv = document.getElementById("hand-ex");
    const manualHelpDiv = document.getElementById("manual-help");
    const boardNoteDiv = document.getElementById("board-note");
    const stepPanel = document.getElementById("step-panel");
    const assistPanel = document.getElementById("assist-panel");
    const disPanel = document.getElementById("disruption-panel");
    const crumbDiv = document.getElementById("replay-crumb");
    const titleH1 = document.getElementById("replay-title");
    const modeTabsDiv = document.getElementById("mode-tabs");

    // ===== ユーティリティ =====
    function safeImage(entry) {
      const path = entry && entry.image_path;
      if (
        typeof path === "string" &&
        path.startsWith("assets/cards/") &&
        !path.includes("..") &&
        (path.endsWith(".jpg") || path.endsWith(".png"))
      ) {
        const img = document.createElement("img");
        img.loading = "lazy";
        img.draggable = false;
        img.alt = entry.name || "カード画像";
        img.onerror = function () { img.remove(); };
        img.src = path;
        return img;
      }
      return null;
    }

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function getParams() {
      const params = new URLSearchParams(location.search);
      return {
        theme: params.get("theme") || "blue-eyes",
        route: params.get("route") || null
      };
    }

    function updateUrl() {
      const params = new URLSearchParams({ theme: paramsTheme, route: state.route.id });
      history.replaceState(null, "", "replay.html?" + params.toString());
    }

    function cardKey(c) {
      if (!c) return "";
      return c.slug || (c.card_id !== null && c.card_id !== undefined ? String(c.card_id) : "") + "|" + (c.name || "");
    }

    function mainCount() {
      return (deckData.deck.main || []).reduce(function (x, e) { return x + e.count; }, 0);
    }

    function stopPlay() {
      playing = false;
      if (playTimer) { clearInterval(playTimer); playTimer = null; }
    }

    function setIdx(n) {
      stopPlay();
      state.idx = Math.max(0, Math.min(n, state.route.steps.length - 1));
      renderAll();
    }

    function stepNext() {
      if (state.idx < state.route.steps.length - 1) {
        state.idx++;
        renderAll();
      } else {
        stopPlay();
      }
    }

    function togglePlay() {
      if (playing) {
        stopPlay();
      } else {
        playing = true;
        playTimer = setInterval(stepNext, SPEED_MS[speed] || 1500);
        stepNext();
      }
      renderReplayToolbar();
      renderStepPanel();
    }

    // ===== 初期化 =====
    async function init() {
      const params = getParams();
      paramsTheme = params.theme;
      try {
        const res = await fetch("./data/decks/" + encodeURIComponent(params.theme) + ".json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        deckData = await res.json();
        if (!deckData || !Array.isArray(deckData.routes) || deckData.routes.length === 0) {
          throw new Error("ルートが見つかりません");
        }
      } catch (e) {
        titleH1.textContent = "デッキデータを読み込めませんでした";
        boardNoteDiv.textContent = "詳細: " + e.message;
        return;
      }

      let route = deckData.routes[0];
      if (params.route) {
        const found = deckData.routes.find(function (r) { return r.id === params.route; });
        if (found) route = found;
      }
      state = { route: route, baseRoute: route, idx: 0, blocked: [], applied: [], openHandler: null };
      updateUrl();
      mode = "replay";
      initPointerDrag();
      renderAll();
    }

    function enterRoute(route, silent) {
      state = { route: route, baseRoute: route, idx: 0, blocked: [], applied: [], openHandler: null };
      if (!silent) updateUrl();
    }

    function applyHandler(disruption, handler) {
      const path = handler.path;
      stopPlay();
      state.applied.push(disruption.jp + " → " + handler.label);
      state.openHandler = null;
      if (path === "continue") {
        state.blocked.push(state.idx);
        state.idx = Math.min(state.idx + 1, state.route.steps.length - 1);
      } else if (path && typeof path === "object" && path.route) {
        const target = deckData.routes.find(function (r) { return r.id === path.route; });
        if (!target) return;
        state.route = target;
        state.blocked = [];
        state.applied.push("→ " + target.name + " へ切り替え");
        state.idx = Math.max(0, path.from_step || 0);
      }
      updateUrl();
      renderAll();
    }

    // ===== 手動操作 =====
    function blankManualBoard() {
      return { monsters: [null, null, null, null, null], spells: [null, null, null, null, null], hand: [], gy: [], banish: [] };
    }

    function deepBoard(b) {
      const out = blankManualBoard();
      const zones = ["monsters", "spells", "hand", "gy", "banish", "extra"];
      for (const z of zones) {
        if (!b || !Array.isArray(b[z])) continue;
        out[z] = b[z].map(function (e) { return e ? Object.assign({}, e) : null; });
      }
      return out;
    }

    function buildPiles() {
      const piles = { main: [], extra: [], side: [] };
      for (const bag of ["main", "extra", "side"]) {
        for (const e of (deckData.deck[bag] || [])) {
          for (let i = 0; i < (e.count || 0); i++) {
            piles[bag].push(Object.assign({ _bag: bag }, e));
          }
        }
      }
      return piles;
    }

    function drawHand(nn) {
      if (!manual || !manual.piles) return [];
      const hand = [];
      for (let i = 0; i < nn && manual.piles.main.length; i++) {
        hand.push(manual.piles.main.splice(Math.floor(Math.random() * manual.piles.main.length), 1)[0]);
      }
      return hand;
    }

    function startManual() {
      stopPlay();
      mode = "manual";
      manual = deepBoard(null);
      manual.piles = buildPiles();
      manual.hand = drawHand(5);
      renderAll();
    }

    function exitManual() {
      mode = "replay";
      manual = null;
      renderAll();
    }

    function resetManual() {
      manual = blankManualBoard();
      manual.piles = buildPiles();
      manual.hand = drawHand(5);
      renderAll();
    }

    function zoneNameJa(zone) {
      return { monsters: "モンスターゾーン", spells: "魔法・罠ゾーン", hand: "手札", gy: "墓地", banish: "除外" }[zone] || zone;
    }

    function manualRemove(src) {
      if (!src) return;
      if (src.type === "slot") {
        manual[src.zone][src.index] = null;
      } else if (src.type === "pile") {
        const arr = manual.piles && manual.piles[src.bag];
        if (arr && src.index >= 0 && src.index < arr.length) arr.splice(src.index, 1);
      } else if (manual && manual[src.zone]) {
        const arr = manual[src.zone];
        let i = -1;
        if (typeof src.index === "number" &&
            src.index >= 0 && src.index < arr.length &&
            arr[src.index] === src.ref) i = src.index;
        if (i === -1 && src.ref) i = arr.indexOf(src.ref);
        if (i === -1 && typeof src.index === "number" &&
            src.index >= 0 && src.index < arr.length) i = src.index;
        if (i !== -1) arr.splice(i, 1);
      }
    }

    function manualPlace(dstZone, dstIndex, payload, dstBag) {
      const entry = payload.entry;
      const from = payload.from || null;
      if (from && from.type === "slot" &&
          from.zone === dstZone && from.index === dstIndex) return;
      manualRemove(from);
      if (dstZone === "deck") {
        manual.piles[dstBag || "main"].push(entry);
      } else if (dstZone === "monsters" || dstZone === "spells") {
        if (manual[dstZone][dstIndex]) manual.gy.push(manual[dstZone][dstIndex]);
        manual[dstZone][dstIndex] = entry;
      } else if (dstZone === "gy" || dstZone === "banish" || dstZone === "hand") {
        manual[dstZone].push(entry);
      }
    }

    function makePayload(entry, from) {
      return { entry: entry, from: from || null };
    }

    function attachDrag(entry, from, imgEl, slotEl) {
      const payload = makePayload(entry, from);
      const holder = slotEl || imgEl;
      if (holder && holder.setAttribute) holder.setAttribute("data-drag", JSON.stringify(payload));
    }

    function attachDrop(targetEl, dstZone, dstIndex, dstBag) {
      if (targetEl && targetEl.setAttribute) {
        targetEl.setAttribute("data-drop", JSON.stringify({ zone: dstZone, index: dstIndex, bag: dstBag || null }));
        targetEl.classList.add("drop-target");
      }
    }

    // ===== ポインタドラッグ（マウス/タッチ共通） =====
    let dragCtx = null;
    let hintEl = null;

    function closestAttr(node, attr) {
      while (node) {
        if (node.getAttribute) {
          const v = node.getAttribute(attr);
          if (v) return node;
        }
        node = node.parentNode;
      }
      return null;
    }

    function elFromPoint(x, y) {
      return document.elementFromPoint ? document.elementFromPoint(x, y) : null;
    }

    function parseAttr(node, attr) {
      try { return JSON.parse(node.getAttribute(attr)); } catch (e) { return null; }
    }

    function sameSource(a, b) {
      if (!a || !b) return false;
      if (!a.entry || !b.entry) return false;
      if (a.entry.name !== b.entry.name) return false;
      const fa = a.from || null, fb = b.from || null;
      return JSON.stringify(fa) === JSON.stringify(fb);
    }

    function clearHint() {
      if (hintEl) { hintEl.classList.remove("drop-hint"); hintEl = null; }
    }

    function moveHint(x, y) {
      const node = elFromPoint(x, y);
      const target = node ? closestAttr(node, "data-drop") : null;
      if (target === hintEl) return;
      clearHint();
      if (target) { target.classList.add("drop-hint"); hintEl = target; }
    }

    function onPointerDown(ev) {
      if (mode !== "manual" || !manual) return;
      const srcEl = closestAttr(ev.target, "data-drag");
      if (!srcEl) return;
      const payload = parseAttr(srcEl, "data-drag");
      if (!payload) return;
      ev.preventDefault();
      dragCtx = { payload: payload, holder: srcEl, startX: ev.clientX, startY: ev.clientY, moved: false, ghost: null, pid: ev.pointerId };
    }

    function makeGhost(payload) {
      const ghost = el("div", "drag-ghost");
      const img = safeImage(payload.entry);
      if (img) ghost.appendChild(img);
      document.body.appendChild(ghost);
      return ghost;
    }

    function moveGhost(ghost, x, y) {
      ghost.style.left = (x - 30) + "px";
      ghost.style.top = (y - 40) + "px";
    }

    function onPointerMove(ev) {
      if (!dragCtx || ev.pointerId !== dragCtx.pid) return;
      const dx = ev.clientX - dragCtx.startX;
      const dy = ev.clientY - dragCtx.startY;
      if (!dragCtx.moved) {
        if (Math.abs(dx) + Math.abs(dy) < 8) return;
        dragCtx.moved = true;
        dragCtx.ghost = makeGhost(dragCtx.payload);
        if (dragCtx.holder.classList) dragCtx.holder.classList.add("dragging-src");
      }
      moveGhost(dragCtx.ghost, ev.clientX, ev.clientY);
      moveHint(ev.clientX, ev.clientY);
      ev.preventDefault();
    }

    function dropTargetAt(x, y) {
      const node = elFromPoint(x, y);
      return node ? closestAttr(node, "data-drop") : null;
    }

    function cleanupDrag(ctx) {
      if (ctx.ghost && ctx.ghost.remove) ctx.ghost.remove();
      if (ctx.holder.classList) ctx.holder.classList.remove("dragging-src");
      clearHint();
    }

    function onPointerUp(ev) {
      if (!dragCtx) {
        // 押下なしのタップ（選択済みのカードを対象に置く）
        if (mode === "manual" && manual.pending) {
          const tgtEl = closestAttr(ev.target, "data-drop");
          if (tgtEl) {
            const t = parseAttr(tgtEl, "data-drop");
            manualPlace(t.zone, t.index, manual.pending, t.bag);
            manual.pending = null;
            renderAll();
          }
        }
        return;
      }
      if (ev.pointerId !== dragCtx.pid) return;
      const ctx = dragCtx;
      dragCtx = null;
      cleanupDrag(ctx);
      if (ctx.moved) {
        const target = dropTargetAt(ev.clientX, ev.clientY);
        if (target) {
          const t = parseAttr(target, "data-drop");
          manualPlace(t.zone, t.index, ctx.payload, t.bag);
          manual.pending = null;
        }
        renderAll();
        return;
      }
      // タップ: 選択/配置
      const srcEl = closestAttr(ev.target, "data-drag");
      const srcPayload = srcEl ? parseAttr(srcEl, "data-drag") : null;
      const tgtEl = closestAttr(ev.target, "data-drop");
      const tgt = tgtEl ? parseAttr(tgtEl, "data-drop") : null;
      if (tgt && manual.pending && !(srcPayload && sameSource(srcPayload, manual.pending))) {
        manualPlace(tgt.zone, tgt.index, manual.pending, tgt.bag);
        manual.pending = null;
      } else if (srcPayload) {
        manual.pending = (manual.pending && sameSource(srcPayload, manual.pending)) ? null : srcPayload;
      }
      renderAll();
    }

    function onPointerCancel(ev) {
      if (!dragCtx || ev.pointerId !== dragCtx.pid) return;
      const ctx = dragCtx;
      dragCtx = null;
      cleanupDrag(ctx);
      renderAll();
    }

    let pointerInitDone = false;
    function initPointerDrag() {
      if (pointerInitDone) return;
      pointerInitDone = true;
      document.addEventListener("pointerdown", onPointerDown);
      document.addEventListener("pointermove", onPointerMove);
      document.addEventListener("pointerup", onPointerUp);
      document.addEventListener("pointercancel", onPointerCancel);
    }

    // ===== 描画 =====
    function renderAll() {
      renderHeader();
      renderModeTabs();
      if (mode === "manual") {
        renderManualToolbar();
      } else {
        renderReplayToolbar();
      }
      renderBoard();
      renderBoardNote();
      renderHandEx();
      renderDeckPanels();
      if (mode === "manual") {
        renderManualSide();
        renderRecommendations();
        disPanel.style.display = "none";
        manualHelpDiv.style.display = "";
        manualHelpDiv.textContent =
          "【手動操作モード】カードをドラッグ（またはタップ選択→移動先タップ）すると元の場所から移動します（コピーではありません）。" +
          "下のデッキ/EXデッキ/サイドから置くと枚数が減り、デッキなどの山札に戻すこともできます。";
      } else {
        renderStepPanel();
        disPanel.style.display = "";
        manualHelpDiv.style.display = "none";
      }
      renderDisruptionPanel();
    }

    function renderHeader() {
      if (mode === "manual") {
        titleH1.textContent = "盤面編集（手動操作）";
      } else {
        titleH1.textContent = "展開リプレイ: " + state.route.name;
      }
      crumbDiv.replaceChildren();
      if (mode === "replay") {
        for (const applied of state.applied) crumbDiv.appendChild(el("span", "crumb", applied));
      }
    }

    function renderModeTabs() {
      modeTabsDiv.replaceChildren();
      const mk = function (label, target) {
        const b = el("button", "mode-tab" + (mode === target ? " active" : ""), label);
        b.addEventListener("click", function () {
          if (mode === target) return;
          if (target === "manual") startManual();
          else exitManual();
        });
        return b;
      };
      modeTabsDiv.appendChild(mk("手動操作", "manual"));
      modeTabsDiv.appendChild(mk("リプレイ", "replay"));
    }

    function renderManualToolbar() {
      toolbarDiv.replaceChildren();
      const resetBtn = el("button", "btn small", "リセット");
      resetBtn.addEventListener("click", resetManual);
      const exitBtn = el("button", "btn secondary small", "リプレイに戻る");
      exitBtn.addEventListener("click", exitManual);
      toolbarDiv.append(resetBtn, exitBtn);
    }

    function renderReplayToolbar() {
      const n = state.route.steps.length;
      toolbarDiv.replaceChildren();
      const firstBtn = el("button", "tbtn", "⏮");
      firstBtn.disabled = state.idx === 0;
      firstBtn.addEventListener("click", function () { setIdx(0); });
      const prevBtn = el("button", "tbtn", "◀");
      prevBtn.disabled = state.idx === 0;
      prevBtn.addEventListener("click", function () { setIdx(state.idx - 1); });
      const playBtn = el("button", "tbtn" + (playing ? " playing" : ""), playing ? "⏸" : "▶");
      playBtn.addEventListener("click", togglePlay);
      const nextBtn = el("button", "tbtn", "▶▶");
      nextBtn.disabled = state.idx >= n - 1;
      nextBtn.addEventListener("click", function () { setIdx(state.idx + 1); });
      const lastBtn = el("button", "tbtn", "⏭");
      lastBtn.disabled = state.idx >= n - 1;
      lastBtn.addEventListener("click", function () { setIdx(n - 1); });

      const seek = el("input", "seek");
      seek.type = "range";
      seek.min = "0";
      seek.max = String(n - 1);
      seek.value = String(state.idx);
      seek.addEventListener("input", function () { setIdx(parseInt(seek.value, 10) || 0); });

      const counter = el("span", "step-counter", (state.idx + 1) + " / " + n);

      const speeds = el("div", "speed-group");
      for (const s of Object.keys(SPEED_MS)) {
        const sb = el("button", "speed-btn" + (s === speed ? " active" : ""), s);
        sb.addEventListener("click", function () {
          speed = s;
          if (playing) {
            clearInterval(playTimer);
            playTimer = setInterval(stepNext, SPEED_MS[speed]);
          }
          renderReplayToolbar();
        });
        speeds.appendChild(sb);
      }
      toolbarDiv.append(firstBtn, prevBtn, playBtn, nextBtn, lastBtn, seek, counter, speeds);
    }

    // --- 盤面本体 ---
    function currentBoard() {
      if (mode === "manual") return manual;
      const step = state.route.steps[state.idx];
      return (step && step.board) || blankManualBoard();
    }

    function actingKey() {
      if (mode === "manual") return null;
      const cur = state.route.steps[state.idx];
      return cur && cur.card ? cardKey(cur.card) : null;
    }

    function zoneRowSlots(zone, list, cls, dropEnabled) {
      const row = el("div", "zone-row" + (dropEnabled ? " droppable" : ""));
      if (cls === "oppmonster") row.classList.add("opp");
      const act = actingKey();
      for (let i = 0; i < list.length; i++) {
        const entry = list[i];
        const slot = el("div", "slot" + (cls ? " " + cls : ""));
        const img = safeImage(entry);
        if (img) {
          if (act && entry && cardKey(entry) === act) slot.classList.add("acting");
          slot.appendChild(img);
        }
        if (dropEnabled) {
          attachDrop(slot, zone, i);
          if (entry) attachDrag(entry, { type: "slot", zone: zone, index: i }, img, slot);
        }
        row.appendChild(slot);
      }
      const wrap = el("div", null);
      wrap.appendChild(row);
      wrap.appendChild(el("div", "zone-label", zoneNameJa(zone)));
      return wrap;
    }

    function stackIn(box, entries, zone, dropEnabled) {
      const stack = el("div", "stack dropzone");
      entries.forEach(function (entry, i) {
        const img = safeImage(entry);
        if (!img) return;
        if (dropEnabled) attachDrag(entry, { type: "list", zone: zone, index: i, ref: entry }, img, null);
        stack.appendChild(img);
      });
      if (entries.length === 0) stack.appendChild(el("span", "empty", "なし"));
      box.appendChild(stack);
      return box;
    }

    function renderBoard() {
      const b = currentBoard();
      boardDiv.replaceChildren();
      const grid = el("div", "board-grid");
      const editing = mode === "manual";

      // 左列: デッキ
      const left = el("div", "bcol left");
      const deckBox = el("div", "tallbox deckchip");
      const deckN = editing && manual.piles ? manual.piles.main.length : mainCount();
      deckBox.appendChild(el("div", "tallbox-name", "デッキ (" + deckN + ")"));
      if (editing) attachDrop(deckBox, "deck", null, "main");
      const deckStack = el("div", "stack");
      for (let i = 0; i < 3; i++) {
        const ghost = el("div", null);
        ghost.style.width = "70%";
        ghost.style.aspectRatio = "59 / 86";
        ghost.style.background = "#c8a86a";
        ghost.style.borderRadius = "4px";
        ghost.style.border = "2px solid #8a6a3a";
        deckStack.appendChild(ghost);
      }
      deckBox.appendChild(deckStack);
      left.appendChild(deckBox);

      // 中央: 相手ゾーン → モンスター → 魔法・罠 → 手札
      const center = el("div", "bcol center");
      center.appendChild(zoneRowSlotsOpp());
      center.appendChild(zoneRowSlots("monsters", b.monsters || [null, null, null, null, null], "monster", editing));
      center.appendChild(zoneRowSlots("spells", b.spells || [null, null, null, null, null], "spell", editing));
      center.appendChild(handZone(b.hand || [], editing));

      // 右列: 墓地 / 除外
      const right = el("div", "bcol right");
      const gyBox = el("div", "tallbox gy");
      gyBox.appendChild(el("div", "tallbox-name", "墓地 (" + (b.gy || []).length + ")"));
      stackIn(gyBox, b.gy || [], "gy", editing);
      if (editing) attachDrop(gyBox, "gy", null);
      right.appendChild(gyBox);
      const banBox = el("div", "tallbox banish");
      banBox.appendChild(el("div", "tallbox-name", "除外 (" + (b.banish || []).length + ")"));
      stackIn(banBox, b.banish || [], "banish", editing);
      if (editing) attachDrop(banBox, "banish", null);
      right.appendChild(banBox);

      grid.appendChild(left);
      grid.appendChild(center);
      grid.appendChild(right);
      boardDiv.appendChild(grid);

    function zoneRowSlotsOpp() {
      const row = el("div", "zone-row opp");
      for (let i = 0; i < 5; i++) row.appendChild(el("div", "slot oppmonster"));
      const wrap = el("div", null);
      wrap.appendChild(row);
      wrap.appendChild(el("div", "zone-label", "相手フィールド"));

    function handZone(hand, editing) {
      const wrap = el("div", null);

      hand.forEach(function (entry, i) {
        const slot = el("div", "hand-slot");
        const img = safeImage(entry);
        if (img) slot.appendChild(img);
        if (editing) {
          attachDrop(slot, "hand", null);
          attachDrag(entry, { type: "list", zone: "hand", index: i, ref: entry }, img, slot);
        }
        row.appendChild(slot);
      });
      if (hand.length === 0) row.appendChild(el("span", "empty-strip", "（0枚）"));

    function renderBoardNote() {
      if (mode === "manual") {
        boardNoteDiv.textContent = "ドラッグまたはタップ→移動先タップでカードを移動。占有ゾーンに置くと元のカードは墓地へ。";
      } else {
        boardNoteDiv.textContent = "青枠はこのアクションで動いたカード（盤面データはドラフト）。「手動操作」タブで自由に動かせます。";

    // --- 手札/EX・デッキパネル ---
    function staticEntry(entry) {
      const slot = el("div", "deck-item");
      const img = safeImage(entry);
      if (img) slot.appendChild(img);
      return slot;
    }

    function pileCard(entry, from) {
      const slot = el("div", "deck-item");
      const img = safeImage(entry);
      if (img) slot.appendChild(img);
      if (manual.pending && manual.pending.entry === entry) slot.classList.add("selected");
      attachDrag(entry, from, img, slot);
      return slot;
    }

    function renderHandEx() {
      const b = currentBoard();
      handExDiv.replaceChildren();
      const editing = mode === "manual";

      const handBox = el("div", "strip-box hand");
      handBox.appendChild(el("div", "strip-title", "手札 (" + (b.hand || []).length + ")"));
      const handStrip = el("div", "card-strip");
      if (editing) attachDrop(handStrip, "hand", null, null);
      (b.hand || []).forEach(function (entry, i) {
        handStrip.appendChild(editing ? pileCard(entry, { type: "list", zone: "hand", index: i, ref: entry }) : staticEntry(entry));
      });
      if ((b.hand || []).length === 0) handStrip.appendChild(el("span", "empty-strip", "なし"));
      handBox.appendChild(handStrip);
      handExDiv.appendChild(handBox);

      const extraBox = el("div", "strip-box extra");
      const exN = editing && manual.piles ? manual.piles.extra.length : (deckData.deck.extra || []).reduce(function (x, e) { return x + e.count; }, 0);
      extraBox.appendChild(el("div", "strip-title", "エクストラデッキ (" + exN + ")"));
      const exStrip = el("div", "card-strip");
      if (editing) attachDrop(exStrip, "deck", null, "extra");
      if (editing && manual.piles) {
        manual.piles.extra.forEach(function (entry, i) {
          exStrip.appendChild(pileCard(entry, { type: "pile", bag: "extra", index: i }));
        });
        if (manual.piles.extra.length === 0) exStrip.appendChild(el("span", "empty-strip", "なし"));
      } else {
        for (const entry of (deckData.deck.extra || [])) {
          for (let i = 0; i < entry.count; i++) exStrip.appendChild(staticEntry(entry));
        }

      extraBox.appendChild(exStrip);
      handExDiv.appendChild(extraBox);

    function renderDeckPanels() {
      const editing = mode === "manual";
      deckPanelDiv.replaceChildren();
      const mainN = editing && manual.piles ? manual.piles.main.length : mainCount();
      deckPanelDiv.appendChild(el("div", "strip-title", "デッキ (" + mainN + ")"));
      const strip = el("div", "deck-strip");
      if (editing) attachDrop(strip, "deck", null, "main");
      if (editing && manual.piles) {
        manual.piles.main.forEach(function (entry, i) {
          strip.appendChild(pileCard(entry, { type: "pile", bag: "main", index: i }));
        });
        if (manual.piles.main.length === 0) strip.appendChild(el("span", "empty-strip", "なし"));
      } else {
        for (const entry of (deckData.deck.main || [])) {
          for (let i = 0; i < entry.count; i++) strip.appendChild(staticEntry(entry));
        }
      }
      deckPanelDiv.appendChild(strip);

      sidePanelDiv.replaceChildren();
      const sideN = editing && manual.piles ? manual.piles.side.length : (deckData.deck.side || []).reduce(function (x, e) { return x + e.count; }, 0);
      sidePanelDiv.appendChild(el("div", "strip-title", "サイドデッキ (" + sideN + ")"));
      const sideStrip = el("div", "deck-strip");
      if (editing) attachDrop(sideStrip, "deck", null, "side");
      if (editing && manual.piles) {
        manual.piles.side.forEach(function (entry, i) {
          sideStrip.appendChild(pileCard(entry, { type: "pile", bag: "side", index: i }));
        });
        if (manual.piles.side.length === 0) sideStrip.appendChild(el("span", "empty-strip", "なし"));
      } else {
        const side = deckData.deck.side || [];
        if (side.length === 0) {
          sideStrip.appendChild(el("span", "empty-strip", "サイドは未設定"));
        } else {
          for (const entry of side) {
            for (let i = 0; i < entry.count; i++) sideStrip.appendChild(staticEntry(entry));
          }
        }
      }
      sidePanelDiv.appendChild(sideStrip);
    }

    // --- 右サイド ---
    // ===== 盤面照合エンジン =====
    function multiset(arr) {
      const m = Object.create(null);
      for (const e of (arr || [])) {
        if (!e) continue;
        const k = e.name || e.jp || "";
        if (k) m[k] = (m[k] || 0) + 1;
      }
      return m;
    }

    function simMultiset(A, B) {
      const aEmpty = !A || A.length === 0;
      const bEmpty = !B || B.length === 0;
      if (aEmpty && bEmpty) return 1;
      if (aEmpty !== bEmpty) return 0;
      const ma = multiset(A), mb = multiset(B);
      let inter = 0, totA = 0, totB = 0;
      for (const k of Object.keys(ma)) {
        totA += ma[k];
        if (mb[k]) inter += Math.min(ma[k], mb[k]);
      }
      for (const k of Object.keys(mb)) totB += mb[k];
      if (totA === 0 || totB === 0) return 0;
      return inter / Math.sqrt(totA * totB);
    }

    function zoneList(board, zone, slotized) {
      const raw = (board && board[zone]) || [];
      return slotized ? raw.filter(Boolean) : raw;
    }

    function boardSim(manual, board) {
      const weights = { monsters: 3, spells: 2, gy: 2, banish: 1, hand: 0.5 };
      let num = 0, den = 0;
      for (const z of Object.keys(weights)) {
        const slotized = z === "monsters" || z === "spells";
        const a = zoneList(manual, z, slotized);
        const b = zoneList(board, z, slotized);
        num += weights[z] * simMultiset(a, b);
        den += weights[z];
      }
      return den ? num / den : 0;
    }

    function hasName(arr, n) {
      return (arr || []).some(function (e) { return e && e.name === n; });
    }

    function cardLocOf(card) {
      const n = card && card.name;
      if (!n) return { label: "（カードなし）", reachable: true };
      if (manual && hasName(manual.hand, n)) return { label: "（手札あり）", reachable: true };
      if (manual && hasName((manual.monsters || []).concat(manual.spells || []), n)) return { label: "（フィールド済）", reachable: true };
      if (manual && manual.piles) {
        if (hasName(manual.piles.main, n)) return { label: "（山札内）", reachable: true };
        if (hasName(manual.piles.extra, n)) return { label: "（EX内）", reachable: true };
        if (hasName(manual.piles.side, n)) return { label: "（サイド内）", reachable: true };
      }
      return { label: "（手元になし）", reachable: false };
    }

    function monstersMatchBonus(board) {
      if (!manual) return 0;
      const a = (manual.monsters || []).filter(Boolean).map(function (e) { return e.name; }).sort().join("|");
      const b = ((board && board.monsters) || []).filter(Boolean).map(function (e) { return e.name; }).sort().join("|");
      if (!a || !b) return 0;
      if (a === b) return 0.15;
      const setB = new Set(b.split("|"));
      const cnt = a.split("|").filter(function (x) { return setB.has(x); }).length;
      return cnt > 0 ? 0.05 : 0;
    }

    function candidateTotal(route, idx, base) {
      let total = base + monstersMatchBonus(route.steps[idx].board);
      const nxt = route.steps[idx + 1];
      if (nxt && nxt.card) {
        const loc = cardLocOf(nxt.card);
        if (loc.label === "（手札あり）") total += 0.25;
        else if (loc.reachable) total += 0.05;
      }
      return total;
    }

    function findBestMatch(manual) {
      let best = null;
      for (const route of (deckData.routes || [])) {
        for (let i = 0; i < route.steps.length; i++) {
          const base = boardSim(manual, route.steps[i].board);
          const total = candidateTotal(route, i, base);
          if (!best || total > best.total + 1e-9) {
            best = { route: route, routeId: route.id, idx: i, score: base, total: total };
          }
        }
      }
      if (!best || best.score < 0.25) return best;
      // 最善候補の次手が手元に届かない場合、届く候補へ差し替え
      const nxt0 = best.route.steps[best.idx + 1];
      if (nxt0 && nxt0.card && !cardLocOf(nxt0.card).reachable) {
        let alt = null;
        for (const route of (deckData.routes || [])) {
          for (let i = 0; i < route.steps.length; i++) {
            const base = boardSim(manual, route.steps[i].board);
            if (base < best.score - 0.1) continue;
            const nxt = route.steps[i + 1];
            if (nxt && nxt.card && cardLocOf(nxt.card).reachable && (!alt || base > alt.score)) {
              alt = { route: route, routeId: route.id, idx: i, score: base, total: base };
            }
          }
        }
        if (alt) return alt;
      }
      return best;
    }

    function adoptMatch(match) {
      stopPlay();
      state = { route: match.route, baseRoute: match.route, idx: match.idx, blocked: [], applied: [], openHandler: null };
      mode = "replay";
      manual = null;
      updateUrl();
      renderAll();
    }

    // ===== 推薦パネル =====
    function renderRecommendations() {
      assistPanel.replaceChildren();
      if (mode !== "manual") return;
      assistPanel.appendChild(el("h3", null, "次のおすすめステップ"));
      const best = findBestMatch(manual);
      if (!best) {
        assistPanel.appendChild(el("div", "note", "照合できるルートがありません"));
        renderAISection(null);
        return;
      }
      const pct = Math.round(best.score * 100);
      assistPanel.appendChild(el("div", "rec-match",
        best.route.name + " の " + (best.idx + 1) + "手目と " + pct + "% 一致"));
      const bar = el("div", "rec-bar");
      const fill = el("div");
      fill.style.width = pct + "%";
      bar.appendChild(fill);
      assistPanel.appendChild(bar);

      const upcoming = best.route.steps.slice(best.idx + 1, best.idx + 3);
      if (upcoming.length === 0) {
        assistPanel.appendChild(el("div", "note", "展開完了に近い状態です"));
      } else {
        for (let i = 0; i < upcoming.length; i++) {
          const st = upcoming[i];
          const card = el("div", "rec-card");
          const img = safeImage(st.card);
          if (img) card.appendChild(img);
          const body = el("div");
          body.appendChild(el("div", "rec-name", "(" + (best.idx + 2 + i) + "手目) " + (st.card ? st.card.name : "")));
          body.appendChild(el("div", "rec-act", st.act || "アクション"));
          if (st.note) body.appendChild(el("div", "rec-note", st.note));
          if (st.card) body.appendChild(el("div", "rec-note", "配置元: " + cardLocOf(st.card).label));
          card.appendChild(body);
          assistPanel.appendChild(card);
        }
      }
      const goBtn = el("button", "btn small", "このルートをリプレイで見る");
      goBtn.addEventListener("click", function () { adoptMatch(best); });
      assistPanel.appendChild(goBtn);
      assistPanel.appendChild(el("div", "ai-note",
        "盤面は既存ルートのスナップショットとの類似度で照合しています。手札の差異は重みを下げて評価。"));
      renderAISection(best);
    }

    // ===== AI相談（Gemini） =====
    function aiGetKey() {
      try { return localStorage.getItem("beyes_gemini_key") || ""; } catch (e) { return ""; }
    }
    function aiSetKey(k) {
      try { if (k) localStorage.setItem("beyes_gemini_key", k); else localStorage.removeItem("beyes_gemini_key"); } catch (e) { /* ignore */ }
    }
    function aiGetModel() {
      try { return localStorage.getItem("beyes_gemini_model") || "gemini-2.5-flash"; } catch (e) { return "gemini-2.5-flash"; }
    }
    function aiSetModel(m) {
      try { m ? localStorage.setItem("beyes_gemini_model", m) : localStorage.removeItem("beyes_gemini_model"); } catch (e) { /* ignore */ }
    }

    function deckSummaryLines() {
      const lines = [];
      const fmt = function (arr) { return (arr || []).map(function (e) { return e.name + "x" + e.count; }).join(", "); };
      lines.push("メイン: " + mainCount() + "枚 → " + fmt(deckData.deck.main));
      lines.push("EX: " + fmt(deckData.deck.extra));
      return lines;
    }

    function buildPrompt(best) {
      const b = currentBoard();
      const names = function (arr) { return (arr || []).map(function (e) { return e && e.name ? e.name : "（空）"; }).join(", "); };
      const lines = [
        "あなたは遊戯王の熟練プレイヤーです。以下のデッキと盤面に対し、次の1手として最善のアクションを提案してください。",
        "",
      ].concat(deckSummaryLines()).concat([
        "",
        "手札: " + names(b.hand),
        "モンスターゾーン: " + (b.monsters || []).map(function (e) { return e ? e.name : "（空）"; }).join(", "),
        "魔法罠ゾーン: " + (b.spells || []).map(function (e) { return e ? e.name : "（空）"; }).join(", "),
        "墓地: " + names(b.gy),
        "除外: " + names(b.banish),
      ]);
      if (best) {
        lines.push("", "一番近い既存ルート: " + best.route.name + "（" + Math.round(best.score * 100) + "% 一致、" +
          best.route.steps.slice(best.idx + 1).map(function (st) { return (st.card ? st.card.name : "") + " " + (st.act || ""); }).join(" → ") + "）");
      }
      lines.push("", "条件: 箇条書き3点以内・各50字程度・日本語。巨大化した盤面より既存ルートに沿った動きを優先。");
      return lines.join("\n");
    }

    async function consultAI(best) {
      const key = aiGetKey();
      if (!key) return;
      const statusDiv = document.getElementById("ai-status");
      const resultDiv = document.getElementById("ai-result");
      if (statusDiv) statusDiv.textContent = "Geminiと通信中…";
      if (resultDiv) { resultDiv.style.display = "none"; }
      const model = aiGetModel();
      const url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent";
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": key },
          body: JSON.stringify({
            contents: [{ parts: [{ text: buildPrompt(best) }] }],
            generationConfig: { temperature: 0.4, maxOutputTokens: 800 }
          })
        });
        const data = await res.json().catch(function () { return null; });
        if (!res.ok) {
          const msg = data && data.error && data.error.message ? data.error.message : ("HTTP " + res.status);
          if (statusDiv) statusDiv.textContent = "AI相談に失敗しました: " + msg;
          return;
        }
        const parts = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
        const text = parts ? parts.map(function (p) { return p.text || ""; }).join("") : "（応答が空でした）";
        if (resultDiv) {
          resultDiv.textContent = text;
          resultDiv.style.display = "";
        }
        if (statusDiv) statusDiv.textContent = "";
      } catch (e) {
        if (statusDiv) statusDiv.textContent = "AI相談に失敗しました: " + e.message;
      }
    }

    function renderAISection(best) {
      const key = aiGetKey();
      const box = el("div");
      const head = el("div", "strip-title", "AIに相談（Gemini）");
      box.appendChild(head);
      const row = el("div", "ai-row");
      if (!key) {
        const keyInput = el("input");
        keyInput.type = "password";
        keyInput.placeholder = "Gemini API キー";
        const saveBtn = el("button", "btn small", "キーを保存");
        saveBtn.addEventListener("click", function () {
          if (keyInput.value.trim()) aiSetKey(keyInput.value.trim());
          renderRecommendations();
        });
        row.append(keyInput, saveBtn);
        const modelInput = el("input");
        modelInput.type = "text";
        modelInput.placeholder = "モデル (既定: " + aiGetModel() + ")";
        modelInput.value = aiGetModel();
        modelInput.addEventListener("change", function () { aiSetModel(modelInput.value.trim() || "gemini-2.5-flash"); });
        row.appendChild(modelInput);
        box.appendChild(row);
        box.appendChild(el("div", "ai-note",
          "Google AI Studio (aistudio.google.com) のAPIキーを入力するとAI相談が使えます。キーはこの端末のlocalStorageにのみ保存され、Gemini APIへのリクエスト以外に送信しません。"));
      } else {
        const askBtn = el("button", "btn small", "📡 今の盤面をAIに相談");
        askBtn.addEventListener("click", function () { consultAI(best); });
        const modelBtn = el("button", "btn secondary small", "設定(" + aiGetModel() + ")");
        modelBtn.addEventListener("click", function () {
          aiSetKey("");
          renderRecommendations();
        });
        row.append(askBtn, modelBtn);
        box.appendChild(row);
        const status = el("div", "note");
        status.id = "ai-status";
        box.appendChild(status);
        const result = el("div", "ai-result");
        result.id = "ai-result";
        result.style.display = "none";
        box.appendChild(result);
      }
      assistPanel.appendChild(box);
    }

    function renderManualSide() {
      stepPanel.replaceChildren();
      stepPanel.appendChild(el("h3", null, "手動操作"));
      const pl = manual.piles || { main: [], extra: [], side: [] };
      stepPanel.appendChild(el("div", "step-note",
        "盤面: モンスター " + (manual.monsters.filter(Boolean).length) +
        " / 魔法罠 " + (manual.spells.filter(Boolean).length) +
        " / 手札 " + manual.hand.length +
        " / 墓地 " + manual.gy.length +
        " / 除外 " + manual.banish.length +
        " / デッキ " + pl.main.length +
        " / EX " + pl.extra.length +
        " / サイド " + pl.side.length));

      const nav = el("div", "nav");
      const resetBtn = el("button", "btn small", "リセット");
      resetBtn.addEventListener("click", resetManual);
      const exitBtn = el("button", "btn secondary small", "リプレイに戻る");
      exitBtn.addEventListener("click", exitManual);
      if (manual.pending) {
        const cancel = el("button", "btn small", "選択解除");
        cancel.addEventListener("click", function () { manual.pending = null; renderBoard(); renderDeckPanels(); });
        nav.appendChild(cancel);
      }
      nav.append(resetBtn, exitBtn);
      stepPanel.appendChild(nav);
    }

    function renderStepPanel() {
      stepPanel.replaceChildren();
      const steps = state.route.steps;
      const idx = state.idx;
      const step = steps[idx] || {};

      stepPanel.appendChild(el("div", "progress", "アクション " + (idx + 1) + " / " + steps.length));
      stepPanel.appendChild(el("div", "act-chip", (step.card ? step.card.name + " - " : "") + (step.act || "アクション")));

      const imgWrap = el("div", null);
      const img = safeImage(step.card);
      if (img) { img.className = "step-image"; imgWrap.appendChild(img); }
      stepPanel.appendChild(imgWrap);

      stepPanel.appendChild(el("div", "step-note", step.note || ""));

      const nav = el("div", "nav");
      const prev = el("button", "btn secondary small", "← 戻る");
      prev.disabled = idx === 0;
      prev.addEventListener("click", function () { setIdx(idx - 1); });
      const next = el("button", "btn small", "次へ →");
      next.disabled = idx >= steps.length - 1;
      next.addEventListener("click", function () { setIdx(idx + 1); });
      nav.append(prev, next);
      stepPanel.appendChild(nav);

      const history = el("div", "history");
      for (let i = 0; i <= idx; i++) {
        const s = steps[i];
        history.appendChild(el("div", "history-line" + (state.blocked.indexOf(i) !== -1 ? " blocked" : ""),
          (i + 1) + ". " + (s.card ? s.card.name + " - " : "") + (s.act || "アクション")));
      }
      stepPanel.appendChild(history);

      const foot = el("div", "nav");
      const reset = el("button", "btn secondary small", "最初からやり直す");
      reset.addEventListener("click", function () { stopPlay(); enterRoute(state.baseRoute, true); renderAll(); });
      foot.appendChild(reset);
      stepPanel.appendChild(foot);
    }

    function stepEvents(step) {
      return Array.isArray(step.events) ? step.events : [];
    }

    function renderDisruptionPanel() {
      disPanel.replaceChildren();
      if (mode === "manual") {
        disPanel.appendChild(el("div", "note", "（手動操作モードでは妨害パネルを非表示にしています）"));
        return;
      }
      disPanel.appendChild(el("h3", null, "相手が打てる妨害"));
      const step = state.route.steps[state.idx];
      for (const d of deckData.disruptions || []) {
        const btn = el("button", "disruption");
        const img = safeImage(d);
        if (img) btn.appendChild(img);
        const canPlay = stepEvents(step).some(function (ev) { return (d.events || []).indexOf(ev) !== -1; });
        const alreadyApplied = state.applied.some(function (a) { return a.indexOf(d.jp) === 0; });
        btn.appendChild(el("span", null, d.jp + (canPlay ? "：このアクションで打てる" : "：今は打てない")));
        if (alreadyApplied) {
          btn.classList.add("disabled");
          btn.disabled = true;
        } else if (canPlay) {
          btn.classList.add("glow");
        }
        btn.addEventListener("click", function () {
          if (btn.disabled) return;
          state.openHandler = state.openHandler === d.id ? null : d.id;
          renderAll();
        });
        disPanel.appendChild(btn);

        if (state.openHandler === d.id) {
          const box = el("div", "handlers");
          if (d.effect) box.appendChild(el("div", "note", d.effect));
          for (const handler of (d.handlers || [])) {
            const hb = el("button", "handler");
            hb.appendChild(el("div", null, "▶ " + handler.label));
            hb.appendChild(el("span", "handler-note", handler.note || ""));
            hb.addEventListener("click", function () { applyHandler(d, handler); });
            box.appendChild(hb);
          }
          disPanel.appendChild(box);
        }
      }
      disPanel.appendChild(el("div", "note", "妨害を適用すると、その状態からの動き方へ遷移します。"));
    }

    // ===== 起動 =====
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
