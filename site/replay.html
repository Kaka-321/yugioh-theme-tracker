    // ===== 全カード検索（YGOPRODeck + Fandom + Yugipedia） =====
    const UPDECK_API = "https://db.ygoprodeck.com/api/v7/cardinfo.php";
    const FANDOM_API = "https://yugioh.fandom.com/api.php";
    const YUGIPEDIA_API = "https://yugipedia.com/api.php";
    let deckSearch = { q: "", busy: false, note: "", results: [], sel: null, webBusy: null };

    function slugifyEn(s) {
      return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }
    function jfetch(url) {
      return fetch(url, { cache: "no-store" }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      });
    }
    function candFromUpdeck(c) {
      const img = c.card_images && c.card_images[0]
        ? (c.card_images[0].image_url_small || c.card_images[0].image_url)
        : null;
      return {
        src: "updeck", key: "c" + (c.id != null ? c.id : c.name), card_id: c.id, slug: null,
        en_name: c.name, name: null, image_path: img, desc: c.desc,
        types: c.type, attribute: c.attribute, level: c.level,
        atk: c.atk != null ? String(c.atk) : null, def: c.def != null ? String(c.def) : null
      };
    }
    function candFromPool(e) {
      return {
        src: "pool", key: deckEntryId(e), entry: e,
        en_name: e.en_name || null,
        name: e.japanese_name || e.name, image_path: e.image_path || null
      };
    }
    function poolMatches(q) {
      const low = q.toLowerCase();
      const out = [];
      for (const e of deckEntryPool()) {
        const names = [e.name, e.japanese_name, e.en_name];
        if (names.some(function (nn) { return typeof nn === "string" && nn.toLowerCase().indexOf(low) !== -1; })) {
          out.push(candFromPool(e));
        }
        if (out.length >= 6) break;
      }
      return out;
    }
    function updeckSearch(q) {
      return jfetch(UPDECK_API + "?fname=" + encodeURIComponent(q) + "&num=10&offset=0&sort=name")
        .then(function (d) { return (d.data || []).map(candFromUpdeck); });
    }
    function updeckExact(en) {
      return jfetch(UPDECK_API + "?name=" + encodeURIComponent(en))
        .then(function (d) { const c = (d.data || [])[0]; return c ? candFromUpdeck(c) : null; });
    }
    function fandomTitles(q) {
      return jfetch(FANDOM_API + "?action=query&list=search&srsearch=" + encodeURIComponent(q) + "&srnamespace=0&srlimit=8&origin=*&format=json&formatversion=2")
        .then(function (d) {
          return ((d.query && d.query.search) || []).map(function (x) { return x.title; })
            .filter(function (t) {
              return !/^(?:List of |Yu-Gi-Oh!|Banned |Forbidden )/i.test(t) &&
                !/(counterpart|anti-support|archetype|banlist|keyword|tips$)/i.test(t);
            })
            .slice(0, 5);
        });
    }
    function wikitextOf(title) {
      return jfetch(YUGIPEDIA_API + "?action=parse&page=" + encodeURIComponent(title) + "&prop=wikitext&formatversion=2&format=json&origin=*")
        .then(function (d) { return (d.parse && (d.parse.wikitext || d.parse["*"])) || ""; });
    }
    function parseBox(wt) {
      const i = wt.indexOf("{{CardTable2");
      if (i === -1) return "";
      let depth = 0;
      for (let j = i; j < wt.length; j++) {
        const ch = wt[j];
        if (ch === "{") depth++;
        else if (ch === "}") {
          depth--;
          if (depth === 0) return wt.slice(i, j + 1);
        }
      }
      return wt.slice(i, i + 30000);
    }
    function boxParam(box, key) {
      const m = box.match(new RegExp("\\|\\s*" + key + "\\s*=\\s*([\\s\\S]*?)(?=\\n\\|\\s*[a-z_0-9]+\\s*=)"));
      return m ? m[1].trim() : null;
    }
    function cleanJaName(s) {
      if (!s) return null;
      s = String(s)
        .replace(/\{\{Ruby\|([^|{}]*)\|[^{}]*\}\}/g, "$1")
        .replace(/\{\{[^{}]*\}\}/g, "")
        .replace(/<[^>]*>/g, "")
        .replace(/\[\[(?:[^|\]]*\|)?([^\]]+)\]\]/g, "$1")
        .replace(/\s+/g, " ").trim();
      return s || null;
    }
    async function listJpFiles(en) {
      const prefixes = [en, en.replace(/ /g, ""), en.replace(/ /g, "_")];
      const all = [];
      for (const p of prefixes) {
        if (!p) continue;
        try {
          const d = await jfetch(YUGIPEDIA_API + "?action=query&list=allimages&aiprefix=" + encodeURIComponent(p) + "&ailimit=60&format=json&formatversion=2&origin=*");
          for (const x of ((d.query && d.query.allimages) || [])) {
            if (all.indexOf(x.name) === -1) all.push(x.name);
          }
        } catch (e) {}
        if (all.some(function (n) { return /-J[PA]-/i.test(n); })) break;
      }
      return all;
    }
    function pickJpFile(names, setCode) {
      const jps = names.filter(function (n) {
        return /-J[PA]-/i.test(n) && /\.(png|jpg)$/i.test(n) &&
          !/-(?:CF01\d*|EA|VA|VG|Monster_Art|ConceptArt|DuelLinks|-Anime|artwork)\b/i.test(n) && !/-OP\.png$/i.test(n);
      });
      if (!jps.length) return null;
      if (setCode) {
        const m = jps.find(function (n) { return n.indexOf(setCode) !== -1 && n.indexOf("QCScR") === -1; }) ||
                  jps.find(function (n) { return n.indexOf(setCode) !== -1; });
        if (m) return m;
      }
      return jps[0];
    }
    function yugipediaFileUrl(name) {
      return jfetch(YUGIPEDIA_API + "?action=query&titles=" + encodeURIComponent("File:" + name) + "&prop=imageinfo&iiprop=url&format=json&formatversion=2&origin=*")
        .then(function (d) {
          const pages = (d.query && d.query.pages) || [];
          const info = pages[0] && pages[0].imageinfo && pages[0].imageinfo[0];
          return info ? info.url : null;
        }).catch(function () { return null; });
    }
    async function buildEntryFromWeb(cand) {
      const en = cand.en_name || cand.name || "";
      let up = cand.src === "updeck" ? cand : null;
      if (!up || (up.card_id == null && up.image_path == null)) {
        if (en) {
          try { up = await updeckExact(en); } catch (e) {}
          if (!up) {
            try {
              const lst = await updeckSearch(en);
              up = lst[0] || up;
            } catch (e) {}
          }
        }
      }
      let jaName = cand.name || null, jaText = null, setCode = null, passcode = null;
      const specs = {};
      try {
        const wt = await wikitextOf(en);
        const box = parseBox(wt);
        if (box) {
          jaName = cleanJaName(boxParam(box, "ja_name")) || jaName;
          jaText = cleanJaName(boxParam(box, "ja_text"));
          const setsRaw = boxParam(box, "jp_sets") || "";
          const m = setsRaw.match(/([A-Z]{4})-JP[0-9]{3}/);
          setCode = m ? m[1] : null;
          passcode = cleanJaName(boxParam(box, "password"));
          for (const k of ["types", "attribute", "level", "atk", "def"]) {
            const v = cleanJaName(boxParam(box, k));
            if (v) specs[k] = v.replace(/\n/g, " ");
          }
        }
      } catch (e) {}
      let imgPath = null;
      try {
        const names = await listJpFiles(en);
        const pick = pickJpFile(names, setCode);
        if (pick) imgPath = await yugipediaFileUrl(pick);
      } catch (e) {}
      const entry = {
        card_id: (up && up.card_id != null) ? up.card_id : (/^\d+$/.test(passcode || "") ? parseInt(passcode, 10) : null),
        slug: null,
        name: jaName || en,
        en_name: en,
        image_path: imgPath || (up && up.image_path) || null,
        desc: jaText || (up && up.desc) || null,
        types: (up && up.types) || specs.types || null,
        attribute: (up && up.attribute) || specs.attribute || null,
        level: (up && up.level) || specs.level || null,
        atk: (up && up.atk) || specs.atk || null,
        def: (up && up.def) || specs.def || null,
        external: true
      };
      if (entry.card_id == null) entry.slug = slugifyEn(en);
      saveExtEntry(entry);
      return entry;
    }
    async function runDeckSearch(rawQ) {
      const q = String(rawQ || "").trim();
      if (!q) return;
      deckSearch = { q: q, busy: true, note: "", results: [], sel: null, webBusy: null };
      renderDeckEditor();
      const results = poolMatches(q);
      const hasJp = /[\u2E80-\u9FFF\uF900-\uFAFF\u3040-\u30FF\uFF66-\uFF9F]/.test(q);
      try {
        if (hasJp) {
          const titles = await fandomTitles(q);
          for (const t of titles) results.push({ src: "fandom", key: "f:" + t, en_name: t, name: null, image_path: null });
        } else {
          const upList = await updeckSearch(q).catch(function () { return []; });
          for (const c of upList) results.push(c);
        }
      } catch (e) {
        deckSearch.note = "検索APIでエラー: " + e.message;
      }
      const seen = {};
      deckSearch.results = results.filter(function (r) {
        if (!r.key || seen[r.key]) return false;
        seen[r.key] = true;
        return true;
      });
      deckSearch.busy = false;
      renderDeckEditor();
    }
    async function selectSearchResult(r) {
      if (!r) return;
      if (r.src === "pool") {
        deckSearch.sel = r.entry;
        renderDeckEditor();
        return;
      }
      deckSearch.webBusy = r.key;
      deckSearch.sel = null;
      renderDeckEditor();
      try {
        deckSearch.sel = await buildEntryFromWeb(r);
        deckSearch.webBusy = null;
        deckSearch.note = "";
      } catch (e) {
        deckSearch.webBusy = null;
        deckSearch.note = "カード情報の取得に失敗: " + e.message;
      }
      renderDeckEditor();
    }

    function renderDeckEditor() {
      const editing = mode === "manual" && manual && manual.piles;
      if (!editing) { deckEditPanelDiv.style.display = "none"; return; }
      deckEditPanelDiv.style.display = "";
      deckEditPanelDiv.replaceChildren();
      const pl = manual.piles;
      const editBox = el("div", "deck-edit");
      editBox.appendChild(el("h4", null, "デッキ編集"));

      const searchRow = el("div", "deck-search-row");
      const qInput = document.createElement("input");
      qInput.className = "deck-search-input";
      qInput.value = deckSearch.q;
      qInput.placeholder = "カード名（日本語・英名どちらも）";
      qInput.addEventListener("keydown", function (ev) {
        if (ev && ev.key === "Enter") runDeckSearch(qInput.value);
      });
      const goBtn = el("button", "btn small", "検索");
      goBtn.addEventListener("click", function () { runDeckSearch(qInput.value); });
      searchRow.append(qInput, goBtn);
      editBox.appendChild(searchRow);

      const noteBits = [];
      if (deckSearch.note) noteBits.push(deckSearch.note);
      if (deckSearch.busy) noteBits.push("検索中…");
      const extAll = decklabExtEntries();
      const staticN = decklabStaticCount();
      if (extAll.length) {
        noteBits.push("外部カード " + extAll.length + " 種（日本語画像 " + staticN + " / 未静的化 " + (extAll.length - staticN) + "）");
      }
      if (noteBits.length) {
        const noteLine = el("div", "deck-search-note", noteBits.join("　"));
        const logBtn = el("button", "btn tiny deck-log-btn", "🧾書き出し");
        logBtn.addEventListener("click", function () {
          const payload = {
            theme: paramsTheme,
            cards: decklabExtEntries()
              .filter(function (e) { return !String(e.image_path || "").startsWith("assets/cards/external/"); })
              .map(function (e) { return { id: e.card_id != null ? e.card_id : null, en: e.en_name }; })
          };
          noteLine.replaceChildren();
          const ta = document.createElement("textarea");
          ta.className = "deck-log-json";
          ta.readOnly = true;
          ta.style.width = "100%";
          ta.style.height = "70px";
          ta.style.fontSize = "10px";
          ta.value = JSON.stringify(payload);
          noteLine.append(ta);
        });
        noteLine.appendChild(logBtn);
        editBox.appendChild(noteLine);
      }

      const resBox = el("div", "deck-search-results");
      for (const r of deckSearch.results) {
        const chip = el("div", "deck-search-chip" +
          (r.src === "pool" && r.entry === deckSearch.sel ? " selected" : "") +
          (deckSearch.webBusy === r.key ? " loading" : ""));
        const img = safeImage(r);
        if (img) chip.appendChild(img);
        const subTag = el("span", "deck-ext-count", r.src === "pool" ? "" : " 🔍web");
        chip.appendChild(el("span", null, r.name || r.en_name || "(名称不明)"));
        chip.appendChild(subTag);
        chip.addEventListener("click", function () { selectSearchResult(r); });
        resBox.appendChild(chip);
      }
      if (!deckSearch.results.length && !deckSearch.busy && deckSearch.q) {
        resBox.appendChild(el("div", "deck-search-note", "該当なし"));
      }
      editBox.appendChild(resBox);

      const sel = deckSearch.sel;
      if (sel) {
        const selBox = el("div", "deck-search-selbox");
        const sImg = safeImage(sel);
        if (sImg) selBox.appendChild(sImg);
        const selInfo = el("div", null);
        selInfo.appendChild(el("div", "deck-search-sel-name", sel.name || sel.en_name));
        const sub = [sel.types, sel.attribute, sel.level, sel.atk != null ? "ATK " + sel.atk : null, sel.def != null ? "DEF " + sel.def : null]
          .filter(Boolean).join(" / ");
        if (sub) selInfo.appendChild(el("div", "deck-search-sel-sub", sub));
        selBox.appendChild(selInfo);
        const addNav = el("div", "nav");
        addNav.style.marginLeft = "auto";
        const addMainBtn = el("button", "btn small", "デッキへ追加");
        addMainBtn.addEventListener("click", function () { addCardToPile("main", sel); });
        const addSideBtn = el("button", "btn small secondary", "サイドへ追加");
        addSideBtn.addEventListener("click", function () { addCardToPile("side", sel); });
        addNav.append(addMainBtn, addSideBtn);
        selBox.appendChild(addNav);
        editBox.appendChild(selBox);
      }

      const ul = el("ul", "deck-edit-list");
      for (const bag of ["main", "extra", "side"]) {
        for (const row of condensedRows(pl, bag)) {
          const li = el("li", "deck-edit-row");
          li.appendChild(el("span", "deck-edit-count", ({ main: "デッキ", extra: "EX", side: "サイド" })[row.bag] + " " + row.count));
          li.appendChild(el("span", "deck-edit-name", row.name));
          const delBtn = el("button", "btn tiny", "−1");
          delBtn.addEventListener("click", function () { removeCardFromPile(row.bag, row.id); });
          li.appendChild(delBtn);
          ul.appendChild(li);
        }
      }
      editBox.appendChild(ul);
      deckEditPanelDiv.appendChild(editBox);
    }

    function deckEntryPool() {
      const pool = [];
      const seen = {};
      const pushC = function (e) {
        const id = deckEntryId(e);
        if (!e || !id || seen[id]) return;
        seen[id] = true;
        pool.push(e);
      };
      for (const bag of ["main", "extra"]) {
        for (const e of (deckData.deck[bag] || [])) pushC(Object.assign({}, e, { count: 1 }));
      }
      for (const e of decklabExtEntries()) pushC(Object.assign({}, e, { external: true, count: 1 }));
      for (const e of themeCards) pushC(e);
      return pool;
    }

    function condensedRows(pl, bag) {
      const rows = [];
      const seen = {};
      for (const e of pl[bag]) {
        const id = deckEntryId(e) || e.name;
        if (!seen[id]) {
          seen[id] = { id: id, bag: bag, name: e.japanese_name || e.name || "?", count: 0 };
          rows.push(seen[id]);
        }
        seen[id].count += 1;
      }
      return rows;
    }

    function addCardToPile(bag, entry) {
      if (!manual || !manual.piles || !manual.piles[bag]) return;
      const id = deckEntryId(entry);
      let cnt = 0;
      for (const e of manual.piles[bag]) {
        if ((deckEntryId(e) || e.name) === id) cnt += 1;
      }
      if (cnt >= 3) return;
      let full = findFullEntry(entry) || entry;
      if (full.name && !full.japanese_name) {} else if (!full.name && (full.japanese_name || full.name)) full = Object.assign({}, full, { name: full.japanese_name || full.name });
      full = Object.assign({}, full, { name: full.japanese_name || full.name });
      manual.piles[bag].push(full);
      manual.history = [];
      renderAll();
    }

    function removeCardFromPile(bag, id) {
      if (!manual || !manual.piles || !manual.piles[bag]) return;
      const idx = manual.piles[bag].findIndex(function (e) { return (deckEntryId(e) || e.name) === id; });
      if (idx !== -1) {
        manual.piles[bag].splice(idx, 1);
        manual.history = [];
        renderAll();
      }
    }

    function renderStepPanel() {
      stepPanel.replaceChildren();
      const steps = state.route.steps;
      const idx = state.idx;
      const step = steps[idx] || {};

      stepPanel.appendChild(el("div", "progress", "アクション " + (idx + 1) + " / " + steps.length));
      stepPanel.appendChild(el("div", "act-chip", (step.card ? step.card.name + " - " : "") + (step.act || "アクション")));

      const imgWrap = el("div", null);
      const img = safeImage(step.card);
      if (img) { img.className = "step-image"; imgWrap.appendChild(img); }
      stepPanel.appendChild(imgWrap);

      stepPanel.appendChild(el("div", "step-note", step.note || ""));

      const nav = el("div", "nav");
      const prev = el("button", "btn secondary small", "← 戻る");
      prev.disabled = idx === 0;
      prev.addEventListener("click", function () { setIdx(idx - 1); });
      const next = el("button", "btn small", "次へ →");
      next.disabled = idx >= steps.length - 1;
      next.addEventListener("click", function () { setIdx(idx + 1); });
      nav.append(prev, next);
      stepPanel.appendChild(nav);

      const history = el("div", "history");
      for (let i = 0; i <= idx; i++) {
        const s = steps[i];
        history.appendChild(el("div", "history-line" + (state.blocked.indexOf(i) !== -1 ? " blocked" : ""),
          (i + 1) + ". " + (s.card ? s.card.name + " - " : "") + (s.act || "アクション")));
      }
      stepPanel.appendChild(history);

      const foot = el("div", "nav");
      const reset = el("button", "btn secondary small", "最初からやり直す");
      reset.addEventListener("click", function () { stopPlay(); enterRoute(state.baseRoute, true); renderAll(); });
      foot.appendChild(reset);
      stepPanel.appendChild(foot);
    }

    function stepEvents(step) {
      return Array.isArray(step.events) ? step.events : [];
    }

    // ===== 手動操作モード: 相手が打てる妨害 =====
    const THEME_DISRUPT_SIM = {
      d_ash: { sim: "negate", note: "対象にしたカードに「無効」表示（効果を無効化扱い）" },
      d_g: { sim: "note", note: "相手がドローを宣言（特殊召喚を伴う展開の記録）" },
      d_droll: { sim: "note", note: "このターン、デッキからカードを手札に加えられない（記録）" },
      d_belle: { sim: "negate", note: "対象にしたカードに「無効」表示（墓地・除外系を止める扱い）" },
      d_imperm: { sim: "negate", note: "対象にしたカードに「無効」表示（無限泡影）" },
      d_wave: { sim: "negate", note: "対象にしたカードに「無効」表示（霊王の波動）" },
      d_resonance: { sim: "negate", note: "対象にしたカードに「無効」表示（覇者の鳴動）" }
    };
    const SIM_JA = {
      negate: "無効", destroy: "破壊", banish_field: "除外", gy_banish: "墓地除外",
      clear_field: "全体破壊", summon: "配置", note: "記録"
    };

    function oppDisruptionList() {
      const themeNames = {};
      const items = [];
      for (const d of (deckData.disruptions || [])) {
        const simInfo = THEME_DISRUPT_SIM[d.id] || { sim: "note", note: d.effect || "" };
        items.push({ src: "theme", entry: d, title: d.title || d.name, sim: simInfo.sim, note: simInfo.note, desc: d.effect || null });
        const nm = String(d.title || d.name || "").trim();
        const en = String(d.en_name || "").trim();
        if (nm) themeNames[nm] = true;
        if (en) themeNames[en] = true;
      }
      for (const c of oppDisruptors) {
        const nm = String(c.name || "").trim();
        const enc = String(c.en_name || "").trim();
        if (themeNames[nm] || (enc && themeNames[enc])) continue;
        items.push({ src: "opp", entry: c, title: nm || enc, sim: SIM_JA[c.sim] ? c.sim : "note", note: c.sim_note || "", desc: c.desc || null });
      }
      return items;
    }

    function disruptionOnEntry(entry) {
      if (mode !== "manual" || !manual || !manual.disrupt) return null;
      const id = deckEntryId(entry);
      if (!id) return null;
      for (const rec of manual.disrupt) {
        if (rec.sim === "negate" && rec.targetId === id) return rec;
      }
      return null;
    }

    function onDisruptChipClick(item) {
      if (mode !== "manual" || !manual) return;
      const pd = manual.pendingDisrupt;
      if (pd && pd.entry === item.entry) {
        manual.pendingDisrupt = null;
        renderAll();
        return;
      }
      if (item.sim === "note") {
        manual.disrupt = manual.disrupt || [];
        manual.disrupt.push({
          uid: manual.disruptSeq = (manual.disruptSeq || 0) + 1,
          src: item.src, entry: item.entry, title: item.title, sim: item.sim,
          note: item.note, targetName: null, moved: null, movedEntry: null, from: null
        });
        manual.pendingDisrupt = null;
        renderAll();
        return;
      }
      manual.pendingDisrupt = {
        uid: manual.disruptSeq = (manual.disruptSeq || 0) + 1,
        src: item.src, entry: item.entry, title: item.title, sim: item.sim, note: item.note
      };
      renderAll();
    }

    function onDisruptTarget(zone, index) {
      const pd = manual && manual.pendingDisrupt;
      if (!pd) return;
      const zones = pd.sim === "gy_banish" ? ["gy"] : ["monsters", "spells"];
      if (zones.indexOf(zone) === -1) return;
      const entry = zone === "gy" ? manual.gy[index] : manual[zone][index];
      if (!entry) return;
      const rec = {
        uid: pd.uid, src: pd.src, entry: pd.entry, title: pd.title, sim: pd.sim,
        note: pd.note,
        targetId: deckEntryId(entry), targetName: entry.japanese_name || entry.name || null,
        targetZone: zone, targetIndex: index,
        moved: null, movedEntry: null, from: null
      };
      if (pd.sim === "destroy" || pd.sim === "banish_field" || pd.sim === "gy_banish") {
        if (zone === "gy") {
          manual.gy.splice(index, 1);
        } else {
          manual[zone][index] = null;
        }
        if (pd.sim === "gy_banish" || pd.sim === "banish_field") {
          manual.banish.push(entry);
          rec.moved = "banish";
        } else {
          manual.gy.push(entry);
          rec.moved = "gy";
        }
        rec.movedEntry = entry;
        rec.from = { kind: zone === "gy" ? "gylist" : "slot", zone: zone, index: index };
      }
      manual.disrupt = manual.disrupt || [];
      manual.disrupt.push(rec);
      manual.pendingDisrupt = null;
      renderAll();
    }

    function cancelDisruption(uid) {
      if (!manual || !manual.disrupt) return;
      const idx = manual.disrupt.findIndex(function (r) { return r.uid === uid; });
      if (idx === -1) return;
      const rec = manual.disrupt[idx];
      if (rec.moved && rec.movedEntry) {
        const arr = rec.moved === "gy" ? manual.gy : manual.banish;
        const p = arr.indexOf(rec.movedEntry);
        let ok = false;
        if (p !== -1) {
          arr.splice(p, 1);
          ok = true;
        }
        if (ok && rec.from) {
          if (rec.from.kind === "slot") {
            if (!manual[rec.from.zone][rec.from.index]) {
              manual[rec.from.zone][rec.from.index] = rec.movedEntry;
            } else if (rec.moved === "gy") {
              manual.gy.push(rec.movedEntry);
            } else {
              manual.banish.push(rec.movedEntry);
              ok = false;
            }
          } else {
            const srcArr = rec.from.kind === "gylist" ? manual.gy : null;
            if (rec.moved === "gy" || !srcArr) {
              manual.gy.push(rec.movedEntry);
            } else {
              srcArr.push(rec.movedEntry);
            }
          }
        }
      }
      if (rec.moved === "opp" && manual.opp && manual.opp[rec.oppIndex] === rec.movedEntry) {
        manual.opp[rec.oppIndex] = null;
      }
      if (rec.moved === "clear" && rec.cleared) {
        for (const e of rec.cleared) {
          const q = manual.gy.indexOf(e);
          if (q !== -1) manual.gy.splice(q, 1);
          let placed = false;
          for (let i = 0; i < manual.monsters.length; i++) {
            if (!manual.monsters[i]) { manual.monsters[i] = e; placed = true; break; }
          }
          if (!placed) manual.gy.push(e);
        }
      }
      manual.disrupt.splice(idx, 1);
      manual.pendingDisrupt = null;
      renderAll();
    }

    function applyClearFieldDisruption(item) {
      const cleared = [];
      for (const e of manual.monsters) {
        if (e) cleared.push(e);
      }
      for (const e of cleared) {
        const i = manual.monsters.indexOf(e);
        manual.monsters[i] = null;
        manual.gy.push(e);
      }
      manual.disrupt = manual.disrupt || [];
      manual.disrupt.push({
        uid: manual.disruptSeq = (manual.disruptSeq || 0) + 1,
        src: item.src, entry: item.entry, title: item.title, sim: "clear_field",
        note: item.note || "", targetName: cleared.length + "体",
        moved: cleared.length ? "clear" : null, movedEntry: null, from: null, cleared: cleared
      });
      manual.pendingDisrupt = null;
      renderAll();
    }

    function applySummonDisruption(item) {
      let idx = -1;
      if (manual.opp) {
        for (let i = 0; i < manual.opp.length; i++) {
          if (!manual.opp[i]) { idx = i; break; }
        }
      }
      if (idx === -1) {
        manual.disrupt = manual.disrupt || [];
        manual.disrupt.push({
          uid: manual.disruptSeq = (manual.disruptSeq || 0) + 1,
          src: item.src, entry: item.entry, title: item.title, sim: "note",
          note: "相手フィールドが満員のため配置できませんでした（記録のみ）",
          targetName: null, moved: null, movedEntry: null, from: null
        });
        manual.pendingDisrupt = null;
        renderAll();
        return;
      }
      const entry = Object.assign({}, item.entry);
      manual.opp[idx] = entry;
      manual.disrupt = manual.disrupt || [];
      manual.disrupt.push({
        uid: manual.disruptSeq = (manual.disruptSeq || 0) + 1,
        src: item.src, entry: item.entry, title: item.title, sim: "summon",
        note: item.note || "", targetName: "相手フィールド",
        moved: "opp", movedEntry: entry, oppIndex: idx, from: null
      });
      manual.pendingDisrupt = null;
      renderAll();
    }

    function renderDisruptionPanel() {
      disPanel.replaceChildren();
      if (mode === "manual") {
        disPanel.appendChild(el("h3", null, "相手が打てる妨害"));
        disPanel.appendChild(el("div", "note", "妨害を選択（対象指定が必要な場合は盤面のカードをクリック）"));
        const pd = manual && manual.pendingDisrupt;
        if (pd) {
          const pb = el("div", "dis-pending", "「" + pd.title + "」: 対象のカードをクリックしてください");
          const cb = el("button", "btn tiny", "キャンセル");
          cb.addEventListener("click", function () { manual.pendingDisrupt = null; renderAll(); });
          pb.appendChild(cb);
          disPanel.appendChild(pb);
        }
        for (const item of oppDisruptionList()) {
          const btn = el("button", "dis-btn" + (pd && pd.entry === item.entry ? " active" : ""));
          const img = safeImage(item.entry);
          if (img) btn.appendChild(img);
          const box = el("div", "dis-txt");
          box.appendChild(el("div", "dis-name", item.title));
          box.appendChild(el("div", "dis-sub", "【" + (SIM_JA[item.sim] || "記録") + "】" + (item.note || "")));
          btn.appendChild(box);
          btn.addEventListener("click", (function (it) {
            return function () {
              if (it.sim === "clear_field") applyClearFieldDisruption(it);
              else if (it.sim === "summon") applySummonDisruption(it);
              else onDisruptChipClick(it);
            };
          })(item));
          disPanel.appendChild(btn);
        }
        const applied = manual && manual.disrupt || [];
        if (applied.length) {
          disPanel.appendChild(el("div", "dis-head", "適用済み妨害 (" + applied.length + ")"));
          for (const rec of applied) {
            const row = el("div", "dis-log");
            row.appendChild(el("span", "dis-log-tit", "▶ " + rec.title + (rec.targetName ? " → " + rec.targetName : "")));
            const cb = el("button", "btn tiny", "◀取り消し");
            cb.addEventListener("click", (function (u) { return function () { cancelDisruption(u); }; })(rec.uid));
            row.appendChild(cb);
            disPanel.appendChild(row);
          }
        }
        disPanel.appendChild(el("div", "note", "無効＝対象に灰色＋無効表示、破壊/除外＝対象を実際に移動、記録＝ログのみ。取り消しで戻せます。"));
        return;
      }
      disPanel.appendChild(el("h3", null, "相手が打てる妨害"));
      const step = state.route.steps[state.idx];
      for (const d of deckData.disruptions || []) {
        const btn = el("button", "disruption");
        const img = safeImage(d);
        if (img) btn.appendChild(img);
        const canPlay = stepEvents(step).some(function (ev) { return (d.events || []).indexOf(ev) !== -1; });
        const alreadyApplied = state.applied.some(function (a) { return a.indexOf(d.jp) === 0; });
        btn.appendChild(el("span", null, d.jp + (canPlay ? "：このアクションで打てる" : "：今は打てない")));
        if (alreadyApplied) {
          btn.classList.add("disabled");
          btn.disabled = true;
        } else if (canPlay) {
          btn.classList.add("glow");
        }
        btn.addEventListener("click", function () {
          if (btn.disabled) return;
          state.openHandler = state.openHandler === d.id ? null : d.id;
          renderAll();
        });
        disPanel.appendChild(btn);

        if (state.openHandler === d.id) {
          const box = el("div", "handlers");
          if (d.effect) box.appendChild(el("div", "note", d.effect));
          for (const handler of (d.handlers || [])) {
            const hb = el("button", "handler");
            hb.appendChild(el("div", null, "▶ " + handler.label));
            hb.appendChild(el("span", "handler-note", handler.note || ""));
            hb.addEventListener("click", function () { applyHandler(d, handler); });
            box.appendChild(hb);
          }
          disPanel.appendChild(box);
        }
      }
      disPanel.appendChild(el("div", "note", "妨害を適用すると、その状態からの動き方へ遷移します。"));
    }

    // ===== 起動 =====
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
