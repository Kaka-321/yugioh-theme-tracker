<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊戯王テーマ情報</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.8;
      background: #f5f7fa;
      color: #222;
    }
    section {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    .note { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>遊戯王テーマ情報</h1>
  <p class="note">非公式の情報整理サイトです。現在は動作確認用のサンプルです。</p>
  <section>
    <h2 id="theme-name">読み込み中…</h2>
    <p id="theme-id"></p>
    <h3>別名・通称</h3>
    <ul id="aliases"></ul>
    <p id="result" role="status"></p>
  </section>
  <script>
    async function loadTheme() {
      const result = document.getElementById("result");
      try {
        const response = await fetch("./data/themes/blue-eyes.json");
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        const theme = await response.json();
        document.getElementById("theme-name").textContent =
          theme.canonical_name;
        document.getElementById("theme-id").textContent =
          "テーマID: " + theme.theme_id;
        for (const alias of theme.aliases) {
          const item = document.createElement("li");
          item.textContent = alias;
          document.getElementById("aliases").appendChild(item);
        }
        result.textContent = "サンプルデータを読み込みました。";
      } catch (error) {
        result.textContent = "データを読み込めませんでした: " + error.message;
      }
    }
    loadTheme();
  </script>
</body>
</html>
