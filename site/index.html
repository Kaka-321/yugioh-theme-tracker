<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊戯王テーマ情報</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.8;
      background: #f5f7fa;
      color: #222;
    }
    section {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .note { color: #555; font-size: 0.9rem; }
    a { color: #1659a5; }
    button {
      font: inherit;
      padding: 8px 14px;
      margin: 4px 8px 4px 0;
      border: 1px solid #b8c4d0;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }
    button.active {
      border-color: #1659a5;
      background: #eaf2fb;
      font-weight: 600;
    }
    .theme-request {
      display: inline-block;
      margin-top: 12px;
    }

    /* 検索機能 */
    .search-container {
      position: relative;
      margin-bottom: 12px;
    }
    #theme-search-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #b8c4d0;
      border-radius: 8px;
      box-sizing: border-box;
    }
    #theme-search-btn {
      position: absolute;
      right: 6px;
      top: 6px;
      bottom: 6px;
      padding: 0 16px;
      margin: 0;
      font-size: 1rem;
    }
    .search-results-info {
      font-size: 0.85rem;
      color: #666;
      margin-top: 6px;
    }

    /* ページネーション */
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      flex-wrap: wrap;
      gap: 8px;
    }
    .page-info {
      font-size: 0.85rem;
      color: #666;
    }
    .pagination-controls {
      display: flex;
      gap: 6px;
    }
    .pagination-btn {
      padding: 6px 12px;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* エラーバッファ */
    #error-buffer {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: #888;
    }
    .error-item {
      margin-bottom: 4px;
      padding: 4px 8px;
      background: #fff5f5;
      border-left: 3px solid #ff6b6b;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>遊戯王テーマ情報</h1>
  <p class="note">
    非公式の情報整理サイトです。登録されたテーマの基本情報をYugipediaから自動更新しています。
  </p>
  <p class="note">最終更新: <span id="current-date"></span></p>

  <section>
    <h2>テーマを選択</h2>

    <div class="search-container">
      <input
        type="text"
        id="theme-search-input"
        placeholder="テーマ名で検索..."
        aria-label="テーマ名の検索"
        autocomplete="off"
      />
      <button
        type="button"
        id="theme-search-btn"
        onclick="filterThemes()"
        title="検索"
      >
        検索
      </button>
    </div>

    <!-- テーマ一覧 -->
    <div id="theme-buttons"></div>
    <p id="theme-list-result" role="status"></p>
    <p id="search-results-info" class="search-results-info" style="display: none;"></p>

    <!-- ページネーション -->
    <div class="pagination" id="pagination-area">
      <div class="page-info">
        <span id="page-number">ページ 1</span> / <span id="total-pages">全ページ</span> 件
      </div>
      <div class="pagination-controls">
        <button type="button" class="pagination-btn" onclick="goToPage(1)">最初へ</button>
        <button type="button" class="pagination-btn" onclick="previousPage()" disabled>前へ</button>
        <button type="button" class="pagination-btn" onclick="nextPage()">次へ</button>
        <button type="button" class="pagination-btn" onclick="goToPage(totalPagesValue)">最後へ</button>
      </div>
    </div>

    <!-- エラーバッファ -->
    <details id="error-details">
      <summary style="cursor: pointer; font-weight: 600;">
        バグ報告（データが不足しているテーマ）
      </summary>
      <div id="error-buffer"></div>
    </details>

    <a
      class="theme-request-link"
      href="https://github.com/Kaka-321/yugioh-theme-tracker/issues/new?template=theme-request.yml"
      target="_blank"
      rel="noopener noreferrer"
    >
      テーマを追加する
    </a>
  </section>

  <section>
    <h2 id="theme-name">テーマを選択してください</h2>
    <p id="theme-id"></p>

    <h3>別名・通称</h3>
    <ul id="aliases"></ul>

    <h3>出典</h3>
    <p id="source"></p>
    <p class="note">
      日本語名と別名は手動登録です。
      出典ページの名前とURLはYugipedia APIから取得しています。
      カード画像・カードテキスト全文は掲載していません。
    </p>

    <p id="result" role="status"></p>
  </section>

  <script>
    // ===== 状態 =====
    let allThemes = [];
    let currentPage = 1;
    let itemsPerPage = 8;
    let totalPagesValue = 1;

    // ===== 要素取得 =====
    const themeButtons    = document.getElementById("theme-buttons");
    const themeListResult = document.getElementById("theme-list-result");
    const result          = document.getElementById("result");
    const searchInput     = document.getElementById("theme-search-input");
    const countInfo       = document.getElementById("search-results-info");
    const pageNumberSpan  = document.getElementById("page-number");
    const totalPagesSpan  = document.getElementById("total-pages");
    const prevBtn         = document.querySelector('.pagination-btn[onclick="previousPage()"]');

    // ===== ユーティリティ =====
    function getFilteredThemes(searchText) {
      const q = (searchText || "").trim().toLowerCase();
      if (!q) return allThemes;
      return allThemes.filter(function (t) {
        const aliases = t.aliases || [];
        return t.canonical_name.toLowerCase().includes(q) ||
               aliases.some(function (a) { return a.toLowerCase().includes(q); });
      });
    }

    function renderButtons(themes) {
      themeButtons.replaceChildren();
      for (const theme of themes) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = theme.canonical_name;
        btn.dataset.themeId = theme.theme_id;
        btn.addEventListener("click", function () {
          loadTheme(theme.theme_id, theme.canonical_name);
        });
        themeButtons.appendChild(btn);
      }
    }

    function updatePaginationUI(filteredCount) {
      totalPagesValue = Math.max(1, Math.ceil(filteredCount / itemsPerPage));
      if (currentPage > totalPagesValue) currentPage = totalPagesValue;
      if (pageNumberSpan) pageNumberSpan.textContent = currentPage.toLocaleString("ja-JP");
      if (totalPagesSpan) totalPagesSpan.textContent = totalPagesValue.toLocaleString("ja-JP");
      if (prevBtn) prevBtn.disabled = currentPage <= 1;
    }

    function renderCurrentPage() {
      const searchText = searchInput ? searchInput.value : "";
      const filtered = getFilteredThemes(searchText);

      const start = (currentPage - 1) * itemsPerPage;
      renderButtons(filtered.slice(start, start + itemsPerPage));

      if (countInfo) {
        countInfo.style.display = "block";
        countInfo.textContent = searchText.trim()
          ? "「" + searchText + "」の検索結果：" + filtered.length + " 件"
          : "テーマ一覧（" + filtered.length + "件）を表示中";
      }
      updatePaginationUI(filtered.length);
    }

    function refreshThemeList() {
      currentPage = 1;
      renderCurrentPage();
    }

    function goToPage(page) {
      const searchText = searchInput ? searchInput.value : "";
      const filtered = getFilteredThemes(searchText);
      const totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));
      currentPage = Math.max(1, Math.min(page, totalPages));
      renderCurrentPage();
    }

    function previousPage() { goToPage(currentPage - 1); }
    function nextPage()     { goToPage(currentPage + 1); }
    function filterThemes() { refreshThemeList(); }

    // ===== エラーバッファ =====
    function logError(message) {
      const buffer = document.getElementById("error-buffer");
      if (!buffer) return;
      const item = document.createElement("div");
      item.className = "error-item";
      item.textContent = "[ERROR] " + message;
      buffer.prepend(item);
    }

    // ===== テーマ一覧読込 =====
    async function loadThemeList() {
      try {
        const res = await fetch("./themes.json");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const payload = await res.json();

        if (!Array.isArray(payload.themes)) {
          throw new Error("テーマ一覧の形式が想定と異なります");
        }

        allThemes = payload.themes;
        themeListResult.textContent = allThemes.length + "件のテーマを読み込みました。";
        refreshThemeList();

        if (allThemes.length > 0) {
          loadTheme(allThemes[0].theme_id, allThemes[0].canonical_name);
        }
      } catch (e) {
        themeListResult.textContent = "テーマ一覧を読み込めませんでした: " + e.message;
        logError("loadThemeList: " + e.message);
      }
    }

    // ===== 個別テーマ読込 =====
    async function loadTheme(themeId, canonicalName) {
      try {
        for (const btn of themeButtons.children) {
          btn.classList.toggle("active", btn.dataset.themeId === themeId);
        }
        result.textContent = "読み込み中…";

        const res = await fetch("./data/themes/" + encodeURIComponent(themeId) + ".json");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const theme = await res.json();

        if (
          typeof theme.canonical_name !== "string" ||
          typeof theme.theme_id !== "string" ||
          !Array.isArray(theme.aliases) ||
          !theme.source ||
          typeof theme.source.title !== "string" ||
          typeof theme.source.url !== "string"
        ) {
          throw new Error("データ形式が想定と異なります");
        }

        const sourceUrl = new URL(theme.source.url);
        if (
          sourceUrl.protocol !== "https:" ||
          sourceUrl.hostname !== "yugipedia.com" ||
          sourceUrl.username ||
          sourceUrl.password
        ) {
          throw new Error("出典URLが想定と異なります");
        }

        document.getElementById("theme-name").textContent = theme.canonical_name;
        document.getElementById("theme-id").textContent = "テーマID: " + theme.theme_id;

        const aliases = document.getElementById("aliases");
        aliases.replaceChildren();
        for (const alias of theme.aliases) {
          const item = document.createElement("li");
          item.textContent = alias;
          aliases.appendChild(item);
        }

        const link = document.createElement("a");
        link.href = sourceUrl.href;
        link.textContent = "Yugipedia: " + theme.source.title;
        document.getElementById("source").replaceChildren(link);

        result.textContent = "テーマ情報と出典を読み込みました。";
      } catch (e) {
        result.textContent = "データを読み込めませんでした: " + e.message;
        logError("loadTheme(" + themeId + "): " + e.message);
      }
    }

    // ===== 日付表示 =====
    function updateJapaneseDate() {
      const el = document.getElementById("current-date");
      if (!el) return;
      el.textContent = new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(new Date());
    }

    // ===== 初期化 =====
    document.addEventListener("DOMContentLoaded", function () {
      if (searchInput) {
        searchInput.addEventListener("input", refreshThemeList);
      }
      updateJapaneseDate();
      loadThemeList();
    });
  </script>
</body>
</html>
