<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊戯王テーマ情報</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.8;
      background: #f5f7fa;
      color: #222;
    }
    section {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .note { color: #555; font-size: 0.9rem; }
    a { color: #1659a5; }
    button {
      font: inherit;
      padding: 8px 14px;
      margin: 4px 8px 4px 0;
      border: 1px solid #b8c4d0;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }
    button.active {
      border-color: #1659a5;
      background: #eaf2fb;
      font-weight: 600;
    }
    .theme-request {
      display: inline-block;
      margin-top: 12px;
    }

    /* 検索機能 */
    .search-container {
      position: relative;
      margin-bottom: 12px;
    }
    #theme-search-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #b8c4d0;
      border-radius: 8px;
      box-sizing: border-box;
    }
    #theme-search-btn {
      position: absolute;
      right: 6px;
      top: 6px;
      bottom: 6px;
      padding: 0 16px;
      margin: 0;
      font-size: 1rem;
    }
    .search-results-info {
      font-size: 0.85rem;
      color: #666;
      margin-top: 6px;
    }

    /* ページネーション */
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    .page-info {
      font-size: 0.85rem;
      color: #666;
    }
    .pagination-controls {
      display: flex;
      gap: 6px;
    }
    .pagination-btn {
      padding: 6px 12px;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* エラーバッファ */
    #error-buffer {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: #888;
    }
    .error-item {
      margin-bottom: 4px;
      padding: 4px 8px;
      background: #fff5f5;
      border-left: 3px solid #ff6b6b;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>遊戯王テーマ情報</h1>
  <p class="note">
    非公式の情報整理サイトです。登録されたテーマの基本情報をYugipediaから自動更新しています。
  </p>

  <section>
    <h2>テーマを選択</h2>

    <div class="search-container">
      <input
        type="text"
        id="theme-search-input"
        placeholder="テーマ名で検索..."
        aria-label="テーマ名の検索"
        autocomplete="off"
      />
      <button
        type="button"
        id="theme-search-btn"
        onclick="filterThemes()"
        title="検索"
      >
        検索
      </button>
    </div>

    <!-- テーマ一覧 -->
    <div id="theme-buttons"></div>
    <p id="theme-list-result" role="status"></p>
    <p id="search-results-info" class="search-results-info" style="display: none;"></p>

    <!-- ページネーション -->
    <div class="pagination" id="pagination-area">
      <div class="page-info">
        <span id="page-number">ページ 1</span> / <span id="total-pages">全ページ</span> 件
      </div>
      <div class="pagination-controls">
        <button type="button" class="pagination-btn" onclick="goToPage(1)">最初へ</button>
        <button type="button" class="pagination-btn" onclick="previousPage()" disabled>前へ</button>
        <button type="button" class="pagination-btn" onclick="nextPage()">次へ</button>
        <button type="button" class="pagination-btn" onclick="goToPage(totalPages)">最後へ</button>
      </div>
    </div>

    <!-- エラーバッファ -->
    <details id="error-details">
      <summary style="cursor: pointer; font-weight: 600;">
        バグ報告（データが不足しているテーマ）
      </summary>
      <div id="error-buffer"></div>
    </details>

    <a
      class="theme-request-link"
      href="https://github.com/Kaka-321/yugioh-theme-tracker/issues/new?template=theme-request.yml"
      target="_blank"
      rel="noopener noreferrer"
    >
      テーマを追加する
    </a>
  </section>

  <section>
    <h2 id="theme-name">テーマを選択してください</h2>
    <p id="theme-id"></p>

    <h3>別名・通称</h3>
    <ul id="aliases"></ul>

    <h3>出典</h3>
    <p id="source"></p>
    <p class="note">
      日本語名と別名は手動登録です。
      出典ページの名前とURLはYugipedia APIから取得しています。
      カード画像・カードテキスト全文は掲載していません。
    </p>

    <p id="result" role="status"></p>
  </section>

  <script>
    const themeButtons = document.getElementById("theme-buttons");
    const themeListResult = document.getElementById("theme-list-result");
    const result = document.getElementById("result");

    async function loadThemeList() {
      try {
        const response = await fetch("./themes.json");
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const payload = await response.json();

        if (
          !Array.isArray(payload.themes) ||
          payload.themes.some(theme =>
            typeof theme.theme_id !== "string" ||
            typeof theme.canonical_name !== "string"
          )
        ) {
          throw new Error("テーマ一覧の形式が想定と異なります");
        }

        themeButtons.replaceChildren();

        for (const theme of payload.themes) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = theme.canonical_name;
          button.dataset.themeId = theme.theme_id;
          button.addEventListener("click", () => {
            loadTheme(theme.theme_id, theme.canonical_name);
          });
          themeButtons.appendChild(button);
        }

        // 全テーマデータを格納
        // 全テーマデータを格納
        allThemes = payload.themes;

        // DOM が完全にロードされたら、検索バーにイベントリスナーを追加
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('theme-search-input');
            if (searchInput) {
              searchInput.addEventListener('input', refreshThemeList);
            }
          });
        } else {
          // DOMContentLoaded すでに実行済みなら即座に登録
          const searchInput = document.getElementById('theme-search-input');
          if (searchInput) {
            searchInput.addEventListener('input', refreshThemeList);
          }
        }

        themeListResult.textContent =
          payload.themes.length + "件のテーマを読み込みました。";

        if (payload.themes.length > 0) {
          loadTheme(payload.themes[0].theme_id, payload.themes[0].canonical_name);
        }
      } catch (error) {
        themeListResult.textContent =
          "テーマ一覧を読み込めませんでした: " + error.message;
      }
    }

    async function loadTheme(themeId, canonicalName) {
      try {
        for (const button of themeButtons.children) {
          button.classList.toggle(
            "active",
            button.dataset.themeId === themeId
          );
        }

        result.textContent = "読み込み中…";

        const response = await fetch("./data/themes/" + encodeURIComponent(themeId) + ".json");
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const theme = await response.json();

        if (
          typeof theme.canonical_name !== "string" ||
          typeof theme.theme_id !== "string" ||
          !Array.isArray(theme.aliases) ||
          !theme.aliases.every(alias => typeof alias === "string") ||
          !theme.source ||
          typeof theme.source.title !== "string" ||
          typeof theme.source.url !== "string"
        ) {
          throw new Error("データ形式が想定と異なります");
        }

        const sourceUrl = new URL(theme.source.url);
        if (
          sourceUrl.protocol !== "https:" ||
          sourceUrl.hostname !== "yugipedia.com" ||
          sourceUrl.username ||
          sourceUrl.password
        ) {
          throw new Error("出典URLが想定と異なります");
        }

        document.getElementById("theme-name").textContent =
          theme.canonical_name;
        document.getElementById("theme-id").textContent =
          "テーマID: " + theme.theme_id;

        const aliases = document.getElementById("aliases");
        aliases.replaceChildren();

        for (const alias of theme.aliases) {
          const item = document.createElement("li");
          item.textContent = alias;
          aliases.appendChild(item);
        }

        const link = document.createElement("a");
        link.href = sourceUrl.href;
        link.textContent = "Yugipedia: " + theme.source.title;

        document.getElementById("source").replaceChildren(link);
        result.textContent = "テーマ情報と出典を読み込みました。";
      } catch (error) {
        result.textContent =
          "データを読み込めませんでした: " + error.message;
      }
    }

    function updatePaginationUI() {
      const totalPages = Math.ceil(allThemes.length / itemsPerPage);
      totalPagesSpan.textContent = totalPages.toLocaleString("ja-JP");
      pageNumber.textContent = currentPage.toLocaleString("ja-JP");
      document.querySelector('.pagination-btn[onclick="previousPage()"]').disabled = currentPage <= 1;
    }

    function filterThemes(searchText = "") {
      const lowerSearch = searchText.toLowerCase();
      return allThemes.filter(theme =>
        theme.canonical_name.toLowerCase().includes(lowerSearch) ||
        (theme.aliases && theme.aliases.some(alias => alias.toLowerCase().includes(lowerSearch)))
      );
    }

    function refreshThemeList() {
      const searchText = document.getElementById("theme-search-input").value;
      const filteredThemes = filterThemes(searchText);
      themeButtons.replaceChildren();

      for (const theme of filteredThemes) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = theme.canonical_name;
        button.dataset.themeId = theme.theme_id;
        button.addEventListener("click", () => {
          loadTheme(theme.theme_id, theme.canonical_name);
        });
        themeButtons.appendChild(button);
      }

      const countInfo = document.getElementById("search-results-info");
      if (countInfo) {
        countInfo.style.display = filteredThemes.length > 0 ? "block" : "none";
        countInfo.textContent = `${filteredThemes.length} 件の結果を表示しています`;
      }

      updatePaginationUI();
    }

    let itemsPerPage = 8;

    function getFilteredThemes(searchText) {
      if (!searchText.trim()) {
        return allThemes;
      }
      
      const lowerSearch = searchText.toLowerCase();
      return allThemes.filter(theme => {
        // aliases が未定義の場合、空配列とみなす（エラーを防ぐ）
        const aliases = theme.aliases || [];
        return theme.canonical_name.toLowerCase().includes(lowerSearch) ||
          aliases.some(alias => alias.toLowerCase().includes(lowerSearch));
      });
    }

    function refreshThemeList() {
      const searchText = document.getElementById("theme-search-input").value.trim();
      const filteredThemes = getFilteredThemes(searchText);
      
      const buttonsContainer = document.getElementById("theme-buttons");
      if (!buttonsContainer) return;
      
      // ページネーションの初期設定
      currentPage = 1;
      
      themeButtons.replaceChildren();
      
      for (const theme of filteredThemes) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = theme.canonical_name;
        button.dataset.themeId = theme.theme_id;
        button.addEventListener("click", () => {
          loadTheme(theme.theme_id, theme.canonical_name);
        });
        themeButtons.appendChild(button);
      }
      
      const countInfo = document.getElementById("search-results-info");
      if (countInfo) {
        countInfo.style.display = filteredThemes.length > 0 ? "block" : "none";
        countInfo.textContent = `${filteredThemes.length} 件の結果を表示しています`;
      }
      
      updatePaginationUI();
    }

    function filterThemes() {
      refreshThemeList();
    }

    function goToPage(page) {
      const totalPages = Math.ceil(allThemes.length / itemsPerPage);
      page = Math.max(1, Math.min(page, totalPages));
      if (page === currentPage) return;
      currentPage = page;
      updatePaginationUI();

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const themesToShow = allThemes.slice(startIndex, endIndex);

      themeButtons.replaceChildren();

      for (const theme of themesToShow) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = theme.canonical_name;
        button.dataset.themeId = theme.theme_id;
        button.addEventListener("click", () => {
          loadTheme(theme.theme_id, theme.canonical_name);
        });
        themeButtons.appendChild(button);
      }

      if (page === currentPage) {
        themeListResult.textContent = "テーマ情報と出典を読み込みました。";
      }
    }

    function previousPage() {
      if (currentPage > 1) goToPage(currentPage - 1);
    }

    function nextPage() {
      const totalPages = Math.ceil(allThemes.length / itemsPerPage);
      if (currentPage < totalPages) goToPage(currentPage + 1);
    }

    function logError(message) {
      const buffer = document.getElementById("error-buffer");
      if (!buffer) return;

      const item = document.createElement("div");
      item.className = "error-item";
      item.textContent = `[ERROR] ${message}`;
      buffer.prepend(item);
    }

    function validateThemeData(theme) {
      if (
        typeof theme.canonical_name !== "string" ||
        typeof theme.theme_id !== "string" ||
        !Array.isArray(theme.aliases) ||
        theme.aliases.some(alias => typeof alias !== "string")
      ) {
        throw new Error("必須項目が欠落しています");
      }
      return true;
    }

    async function loadTheme(themeId, canonicalName) {
      if (!validateThemeData({ themeId, canonicalName })) {
        logError('無効なテーマデータ');
        return;
      }

      try {
        const response = await fetch(`https://yugioh-api.3kiz.com/v1/themes/${themeId}/`);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        themeListResult.textContent = 'テーマ情報を読み込みました';
        sourceLink.textContent = '';

        let link = document.createElement('a');
        link.href = `https://www.yugioh-card.com/jp/chara/?id=${themeId}`;
        link.textContent = '詳細ページへ';
        link.target = '_blank';
        sourceLink.appendChild(link);
        
      } catch (error) {
        logError(`loadTheme エラー：${error.message}`);
      }
    }

    // 検索バーに入力時のフィルタリングを登録（allThemes が読み込まれた後）
    const searchInput = document.getElementById('theme-search-input');
    if (searchInput && allThemes.length > 0) {
      searchInput.addEventListener('input', refreshThemeList);
    } else if (searchInput) {
      // まだ全テーマが読み込まれていない場合は、loadThemeList で登録する
      const originalLoadThemeList = loadThemeList;
      loadThemeList = async () => {
        await originalLoadThemeList();
        searchInput.addEventListener('input', refreshThemeList);
      };
    }
